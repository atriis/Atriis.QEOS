# The image's "main" access log with the requested path in place of the request line: the trace viewer's URL
# (/trace-viewer/index.html?trace=...) carries a one-time link in its query (ADR-037), so no query is logged. The path
# comes from $request_uri, not $uri, so an SPA route stays visible after try_files falls back to /index.html. This
# file is included at http level (conf.d), where map and log_format belong.
map $request_uri $qeos_request_path {
    "~^([^?]*)" $1;
}
log_format qeos_no_query '$remote_addr - $remote_user [$time_local] "$request_method $qeos_request_path $server_protocol" '
                         '$status $body_bytes_sent "$http_referer" "$http_user_agent" "$http_x_forwarded_for"';

server {
    # An unprivileged port: the image runs as nginx, not root (ADR-038)
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Every location, so a /trace-viewer URL another location answers (/trace-viewer without the slash) is covered too
    access_log /var/log/nginx/access.log qeos_no_query;

    # Hashed build assets may cache forever; index.html must not.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # Written at container start from the environment (docker-entrypoint.d/40-qeos-config.sh); /tmp keeps the root
    # filesystem read-only
    location = /config.js {
        alias /tmp/qeos-config/config.js;
        default_type application/javascript;
        add_header Cache-Control "no-store";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    # Playwright's trace viewer (ADR-037), copied in by the build (scripts/copy-trace-viewer.mjs). Its page URL
    # carries a one-time trace link, so no Referer leaves it. Revalidated (no-cache), so a Playwright update reaches
    # the browser: its index.html, sw.bundle.js and snapshot.html have fixed names. A path it does not have is a 404,
    # never the dashboard's index.html: its service worker's scope is /trace-viewer/. This server sets no add_header
    # at server level, so nothing is lost by setting them here; keep any future one repeated in this block.
    location /trace-viewer/ {
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-cache" always;
        # The error log would print the request line, link included: critical messages only
        error_log /var/log/nginx/error.log crit;
        try_files $uri $uri/ =404;
    }
    location / {
        try_files $uri /index.html;
    }
}

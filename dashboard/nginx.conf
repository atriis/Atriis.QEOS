server {
    # An unprivileged port: the image runs as nginx, not root (ADR-038)
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets may cache forever; index.html must not.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # Written at container start from the environment (docker-entrypoint.d/40-qeos-config.sh); /tmp keeps the root
    # filesystem read-only
    location = /config.js {
        alias /tmp/qeos-config/config.js;
        default_type application/javascript;
        add_header Cache-Control "no-store";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri /index.html;
    }
}

# GitLab CI template: upload JUnit XML results to a QEOS platform.
#
# include:
#   - remote: https://raw.githubusercontent.com/atriis/Atriis.QEOS/collector-v0.9.0/templates/qeos-collector.gitlab-ci.yml
#
# Set QEOS_URL as a CI/CD variable and QEOS_API_KEY as a masked variable.
# Override QEOS_PATTERNS (and optionally QEOS_ENVIRONMENT, QEOS_EXTRA_ARGS).
# The names from before the QEOS rename (QAV_PATTERNS, QAV_EXTRA_ARGS, QAV_COLLECTOR_REF,
# QAV_ENVIRONMENT, QAV_URL) still apply when the QEOS_* name is unset.

.qeos-collector:
  image: python:3.12-slim
  # No defaults under variables: a job-level default would hide a project's QAV_* variables
  script:
    - QEOS_PATTERNS="${QEOS_PATTERNS:-${QAV_PATTERNS:-reports/**/*.xml}}"
    - QEOS_EXTRA_ARGS="${QEOS_EXTRA_ARGS:-${QAV_EXTRA_ARGS:-}}"
    - QEOS_COLLECTOR_REF="${QEOS_COLLECTOR_REF:-${QAV_COLLECTOR_REF:-collector-v0.9.0}}"
    - apt-get update -qq && apt-get install -y -qq git > /dev/null
    - pip install --quiet "qeos-collector @ git+https://github.com/atriis/Atriis.QEOS@${QEOS_COLLECTOR_REF}#subdirectory=collector"
    - qeos-collector upload ${QEOS_PATTERNS} --url "${QEOS_URL}" ${QEOS_ENVIRONMENT:+--environment "${QEOS_ENVIRONMENT}"} ${QEOS_EXTRA_ARGS}

qeos-collector-upload:
  extends: .qeos-collector
  stage: .post
  rules:
    - when: always  # report results even when the test job failed

# Suggested tests first (Cucumber, collector 0.7.0): run the test command through run-impact instead of
# uploading reports afterwards. The likely affected scenarios run first, then the rest, as one run; add
# --suggested-only to run only them (the full suite runs when there is no suggestion, and whenever QEOS
# cannot score the change). The merge request's target branch must be in the clone, or there is no
# change to score. The key needs the "test suggestions" permission (Project Settings > API keys).

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qeos-shared"
version = "0.1.0"
description = "Shared configuration and database wiring for QEOS services"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.1,<2.2",
    # qeos_shared.metrics; each service pins the exact version in its requirements.txt
    "prometheus-client>=0.20",
]

# Declared explicitly rather than left to auto-discovery: with tests/ sitting beside
# qeos_shared/, setuptools' flat-layout discovery errors out rather than guessing.
[tool.setuptools]
packages = ["qeos_shared"]

# The Overview widget catalogue is data, not code: listed so a wheel carries it (qeos_shared.overview_widgets)
[tool.setuptools.package-data]
qeos_shared = ["overview_widgets.json"]

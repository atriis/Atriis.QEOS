# Monitoring is on (ADR-027). Every /grafana/ request is checked by auth-service first: the qeos_grafana
# cookie must belong to an active superuser. Grafana is resolved at request time, so the gateway starts
# without it (502 until it is up).

#% Rendered by entrypoint.sh like nginx.conf.template: GRAFANA_UPSTREAM, UPSTREAM_SUFFIX and FORWARDED_PROTO
location = /grafana {
    absolute_redirect off;
    return 301 /grafana/;
}

# ^~: no regex location below can take a /grafana/ path past auth_request
location ^~ /grafana/ {
    # Grafana loads many assets per dashboard: a bigger burst than the API's
    limit_req zone=api burst=100 nodelay;

    # Fail closed: a qeos_grafana the stripping maps left in (only a hand-made Cookie header does that: a
    # third copy, a space before "=") never reaches Grafana. Runs before the check
    if ($grafana_cookie ~ "(^|;)\s*qeos_grafana\s*=") {
        return 400 '{"detail":"Bad Request"}';
    }

    auth_request /_qeos_grafana_check;
    auth_request_set $qeos_grafana_user $upstream_http_x_qeos_user_email;

    # error_page here replaces the server-level list, so the JSON pages are named again. Only a 2xx
    # from the check lets a request through: 401 goes to sign-in, 403 is refused, and a failed check
    # (auth-service down or any other status) is a 500 from auth_request, answered as 502 Bad Gateway
    error_page 401 = @grafana_sign_in;
    error_page 403 @grafana_forbidden;
    error_page 429 @too_many_requests;
    error_page 500 502 = @bad_gateway;
    error_page 504 = @gateway_timeout;

    # proxy_set_header here replaces the http-level list, so it is repeated in full
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto ${FORWARDED_PROTO};
    proxy_set_header X-Request-ID $req_id;
    # Always overwritten: a client-sent X-QEOS-User-Email never reaches Grafana's auth proxy. The value
    # comes only from auth-service's answer to the check
    proxy_set_header X-QEOS-User-Email $qeos_grafana_user;
    # The platform's bearer token has no business in Grafana; the gateway signs the user in by header
    proxy_set_header Authorization "";
    # Nor has the qeos_grafana cookie: Grafana gets the browser's other cookies only ($grafana_cookie,
    # nginx.conf.template). The check above still reads the full $http_cookie
    proxy_set_header Cookie $grafana_cookie;

    set $grafana_upstream http://${GRAFANA_UPSTREAM};
    proxy_pass $grafana_upstream;
}

# Not signed in to monitoring: the dashboard's /monitoring page signs in if needed, hands over the cookie
# and comes back. `next` is the path only, still percent-encoded as the client sent it ($grafana_next,
# nginx.conf.template): never the decoded $uri, whose CR LF would inject headers (Ruling 4)
location @grafana_sign_in {
    absolute_redirect off;
    add_header X-Request-ID $req_id always;
    add_header Cache-Control no-store always;
    return 302 /monitoring?next=$grafana_next;
}

location @grafana_forbidden {
    add_header X-Request-ID $req_id always;
    return 403 '{"detail":"Forbidden"}';
}

# The check itself (Rulings 1-2). Internal: no client can request it. Only the browser's cookies go up
# (the qeos_grafana cookie is the credential), never the body or any other client header
location = /_qeos_grafana_check {
    internal;
    proxy_pass_request_body off;
    proxy_pass_request_headers off;
    proxy_set_header Content-Length "";
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto ${FORWARDED_PROTO};
    proxy_set_header X-Request-ID $req_id;
    proxy_set_header Cookie $http_cookie;
    # Spelled out although proxy_pass_request_headers is off: neither ever reaches the check
    proxy_set_header Authorization "";
    proxy_set_header X-QEOS-User-Email "";
    set $auth_upstream http://auth-service${UPSTREAM_SUFFIX}:8000;
    proxy_pass $auth_upstream/internal/v1/grafana-check;
}

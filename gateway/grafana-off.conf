# Monitoring is off (MONITORING_ENABLED is not true; ADR-027, Ruling 3): /grafana and /grafana/ are a
# plain JSON 404 for everyone, signed in or not.
location = /grafana {
    add_header X-Request-ID $req_id always;
    return 404 '{"detail":"Not Found"}';
}

location /grafana/ {
    add_header X-Request-ID $req_id always;
    return 404 '{"detail":"Not Found"}';
}

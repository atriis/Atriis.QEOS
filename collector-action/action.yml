name: QEOS collector
description: >-
  Upload test reports as one run to a QEOS platform, run a Cucumber test
  command with the scenarios a change likely affects first (impact: first or only),
  or keep the project's test cases in sync with the repository's .feature files
  (command: import-features). Provide the project API key as the QEOS_API_KEY
  environment variable on the step - never as an input, so it stays out of the
  action log. QAV_API_KEY, the name before the QEOS rename, still works with a
  deprecation warning.

inputs:
  url:
    description: Platform URL (e.g. https://qeos.example.com)
    required: true
  command:
    description: >-
      upload (default): upload the reports in patterns, or run the tests with impact.
      import-features: keep the test cases equal to the .feature files in patterns
      (qeos-collector import-features; collector 0.9.2 or later). The action installs
      the collector from its own checkout, so it works from a private Atriis.QEOS for private or
      internal repositories of the organization (a public repository cannot use a private action).
    required: false
    default: "upload"
  patterns:
    description: >-
      Report glob patterns, space separated (** matches directories), uploaded when
      impact is off. Default: the patterns list in .qeos.yml. Not used with impact.
      With command import-features: the .feature globs (default: features in .qeos.yml, else **/*.feature).
    required: false
    default: ""
  environment:
    description: Environment label stored on the run (e.g. staging)
    required: false
    default: ""
  extra-args:
    description: >-
      Extra qeos-collector flags, split into words as a POSIX shell would (quotes
      group, no expansion), e.g. --fail-on-error --no-changes, or --cucumber js with impact
    required: false
    default: ""
  impact:
    description: >-
      off (default): upload the reports in patterns. first: run test-command with the
      likely affected scenarios first, then the rest, and upload both as one run. only:
      run only the likely affected scenarios (the full suite when there is no
      suggestion). Cucumber only; collector 0.7.0 or later.
    required: false
    default: "off"
  test-command:
    description: >-
      The Cucumber command to run with impact first or only, run by bash as written
      (quotes included), e.g. npx cucumber-js --tags "not @wip"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install qeos-collector (pinned to this action's ref)
      shell: bash
      # From the action's own checkout: GitHub downloads the whole repository at the ref the
      # workflow names, so ../collector is that same version. GITHUB_ACTION_REPOSITORY and
      # GITHUB_ACTION_REF are not reliable here (empty when the action runs inside a reusable
      # workflow), which made the old git+https install fail with "empty revision".
      run: python -m pip install --quiet "$GITHUB_ACTION_PATH/../collector"
    # Inputs reach the scripts only as environment variables, never as ${{ }} text inside them, so no input is ever
    # parsed as shell code; extra-args goes to the collector as one string (QEOS_ACTION_EXTRA_ARGS), which it splits itself
    - name: The command input must be upload or import-features
      if: inputs.command != 'upload' && inputs.command != 'import-features'
      shell: bash
      run: |
        echo "::error::the command input must be upload or import-features"
        exit 2
    - name: Sync test cases from .feature files
      if: inputs.command == 'import-features'
      shell: bash
      env:
        QEOS_ACTION_URL: ${{ inputs.url }}
        QEOS_ACTION_PATTERNS: ${{ inputs.patterns }}
        QEOS_ACTION_EXTRA_ARGS: ${{ inputs.extra-args }}
      run: |
        set -f  # the patterns are split on spaces, never expanded by the shell: the collector expands them
        # shellcheck disable=SC2086
        qeos-collector import-features $QEOS_ACTION_PATTERNS --url "$QEOS_ACTION_URL"
    - name: Upload test results
      if: inputs.command == 'upload' && inputs.impact == 'off'
      shell: bash
      env:
        QEOS_ACTION_URL: ${{ inputs.url }}
        QEOS_ACTION_PATTERNS: ${{ inputs.patterns }}
        QEOS_ACTION_ENVIRONMENT: ${{ inputs.environment }}
        QEOS_ACTION_EXTRA_ARGS: ${{ inputs.extra-args }}
      run: |
        set -f  # the patterns are split on spaces, never expanded by the shell: the collector expands them
        # shellcheck disable=SC2086
        qeos-collector upload $QEOS_ACTION_PATTERNS --url "$QEOS_ACTION_URL" \
          ${QEOS_ACTION_ENVIRONMENT:+--environment "$QEOS_ACTION_ENVIRONMENT"}
    - name: Run the tests, the likely affected ones first
      if: inputs.command == 'upload' && inputs.impact != 'off'
      shell: bash
      env:
        QEOS_IMPACT_MODE: ${{ inputs.impact }}
        QEOS_TEST_COMMAND: ${{ inputs.test-command }}
        QEOS_ACTION_URL: ${{ inputs.url }}
        QEOS_ACTION_ENVIRONMENT: ${{ inputs.environment }}
        QEOS_ACTION_EXTRA_ARGS: ${{ inputs.extra-args }}
      run: |
        case "$QEOS_IMPACT_MODE" in
          first) set -- ;;
          only) set -- --suggested-only ;;
          *) echo "::error::the impact input must be off, first or only"; exit 2 ;;
        esac
        if [ -z "$QEOS_TEST_COMMAND" ]; then
          echo "::error::impact first or only needs the test-command input"
          exit 2
        fi
        # The test command runs as bash -c "$QEOS_TEST_COMMAND": the same trust as a run: step its author wrote.
        # run-impact hands its own arguments to it as "$@", never as shell text
        qeos-collector run-impact --url "$QEOS_ACTION_URL" \
          ${QEOS_ACTION_ENVIRONMENT:+--environment "$QEOS_ACTION_ENVIRONMENT"} \
          "$@" -- bash -c "$QEOS_TEST_COMMAND"

# Production overrides for one VM. Caddy terminates public TLS with a Let's Encrypt
# certificate and is the only published service; everything else stays on the compose
# network. Always used together with the base file, from the repository root:
#
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
#
# deploy/README.md is the installation guide.

services:
  postgres:
    restart: unless-stopped
  auth-service:
    restart: unless-stopped
    environment:
      # Verification links in emails must point at the public address
      BASE_URL: https://${QEOS_DOMAIN:?set QEOS_DOMAIN (see deploy/README.md)}
  organization-service:
    restart: unless-stopped
  project-service:
    restart: unless-stopped
  ingestion-service:
    restart: unless-stopped
    environment:
      # Run links in failure notifications must point at the public address
      DASHBOARD_URL: https://${QEOS_DOMAIN:?set QEOS_DOMAIN (see deploy/README.md)}
  test-management-service:
    restart: unless-stopped
  ingestion-retention:
    restart: unless-stopped
  analytics-rollup:
    restart: unless-stopped
  weekly-summary:
    restart: unless-stopped
    environment:
      # Report links in weekly summaries must point at the public address
      DASHBOARD_URL: https://${QEOS_DOMAIN:?set QEOS_DOMAIN (see deploy/README.md)}
  dashboard:
    restart: unless-stopped
  grafana:
    environment:
      # Grafana's links and redirects must use the public address
      GF_SERVER_ROOT_URL: https://${QEOS_DOMAIN:?set QEOS_DOMAIN (see deploy/README.md)}/grafana/

  gateway:
    restart: unless-stopped
    # Reachable only through the edge proxy
    ports: !reset []
    environment:
      # The public HTTPS port, which service redirects are rewritten to
      GATEWAY_HTTPS_PORT: "443"
      # Believe X-Forwarded-For from the edge proxy's fixed address and nothing else, so
      # per-IP rate limits see each real client instead of one shared proxy address. Not
      # the whole subnet: that includes the Docker host's bridge address.
      GATEWAY_TRUSTED_PROXIES: "172.30.0.10"

  edge:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "${EDGE_HTTP_PORT:-80}:80"
      - "${EDGE_HTTPS_PORT:-443}:443"
    environment:
      QEOS_DOMAIN: ${QEOS_DOMAIN:?set QEOS_DOMAIN (see deploy/README.md)}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL (Let's Encrypt expiry notices)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - qeos_caddy_data:/data
      - qeos_caddy_config:/config
    networks:
      default:
        # The one address the gateway trusts for X-Forwarded-For
        ipv4_address: 172.30.0.10
    depends_on:
      gateway:
        condition: service_healthy

networks:
  # A fixed subnet, so the edge proxy can hold a fixed address. Dynamic addresses come
  # from the upper half only: otherwise a service starting first can take .10.
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          ip_range: 172.30.0.128/25

volumes:
  # Certificates and the ACME account: losing this volume means re-issuing, not data loss
  # Explicit names: the physical volumes keep the names they had before the QEOS rename
  qeos_caddy_data:
    name: qa-vision_qav_caddy_data
  qeos_caddy_config:
    name: qa-vision_qav_caddy_config

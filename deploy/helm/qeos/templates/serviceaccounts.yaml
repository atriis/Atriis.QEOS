{{- /* One ServiceAccount per workload identity the services use (qeos-<identity>); with Key Vault each is federated with
its managed identity. The migration hook's own account is in migrate-hook.yaml */ -}}
{{- $identities := list }}
{{- range $name, $svc := merge (dict) (include "qeos.monitoringWorkloads" . | fromJson) .Values.services }}
{{- if $svc.identity }}
{{- $identities = append $identities $svc.identity }}
{{- end }}
{{- end }}
{{- range $identity := $identities | uniq | sortAlpha }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ printf "qeos-%s" $identity }}
  labels:
    {{- include "qeos.labels" (dict "ctx" $ "name" (printf "qeos-%s" $identity) "component" "identity") | nindent 4 }}
  {{- if eq $.Values.secrets.source "keyvault" }}
  annotations:
    azure.workload.identity/client-id: {{ required (printf "keyvault.clientIds.%s is required with secrets.source keyvault" $identity) (get $.Values.keyvault.clientIds $identity) | quote }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}

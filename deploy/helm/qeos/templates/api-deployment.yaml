{{- /* The five APIs: uvicorn on 8000, /health, and an init container that waits for the migration hook's schema */ -}}
{{- range $name, $svc := .Values.services }}
{{- if eq $svc.kind "api" }}
{{- $ctx := dict "ctx" $ "name" $name "svc" $svc "uid" 10001 }}
{{- $image := include "qeos.image" (dict "ctx" $ "image" (default $name $svc.image)) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "qeos.labels" (dict "ctx" $ "name" $name "component" "api") | nindent 4 }}
spec:
  replicas: {{ $svc.replicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "qeos.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "qeos.labels" (dict "ctx" $ "name" $name "component" "api") | nindent 8 }}
        {{- include "qeos.identityLabels" $ctx | nindent 8 }}
      annotations:
        checksum/env: {{ include "qeos.env" $ctx | sha256sum }}
    spec:
      serviceAccountName: {{ printf "qeos-%s" $svc.identity }}
      {{- include "qeos.podCommon" $ctx | nindent 6 }}
      initContainers:
        # Serves nothing until its database is at this image's migration head (files/wait-for-schema.sh)
        - name: wait-for-schema
          image: {{ $image }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["sh", "/opt/qeos/scripts/wait-for-schema.sh", {{ required (printf "services.%s.appDir is required" $name) $svc.appDir | quote }}]
          envFrom:
            - configMapRef:
                name: {{ printf "qeos-%s-env" $name }}
          env:
            {{- include "qeos.secretEnv" $ctx | nindent 12 }}
          securityContext:
            {{- include "qeos.containerSecurity" $ctx | nindent 12 }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: scripts
              mountPath: /opt/qeos/scripts
              readOnly: true
      containers:
        - name: {{ $name }}
          image: {{ $image }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ printf "qeos-%s-env" $name }}
          env:
            {{- include "qeos.secretEnv" $ctx | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          {{- include "qeos.lifecycle" $ctx | nindent 10 }}
          securityContext:
            {{- include "qeos.containerSecurity" $ctx | nindent 12 }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- include "qeos.secretsMount" $ctx | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: scripts
          configMap:
            name: qeos-scripts
        {{- include "qeos.secretsVolume" $ctx | nindent 8 }}
{{- end }}
{{- end }}

{{- /* Grafana (monitoring.enabled), as Compose's: grafana/grafana with Compose's settings, its data source (the cluster's
Prometheus, monitoring.prometheusUrl) and Compose's dashboards and dashboard provider (files/monitoring/grafana, copies).
Users are signed in by the gateway (ADR-027): it checks the qeos_grafana cookie with auth-service and sends
X-QEOS-User-Email, which Grafana's auth proxy believes from 127.0.0.1 only. On Compose that is the gateway's fixed
address; pod IPs change, so here Grafana listens on the pod's 127.0.0.1:3000 and the grafana-proxy sidecar (the gateway's
nginx-unprivileged image) answers Service grafana: it forwards only requests carrying the shared key the gateway sends
as X-QEOS-Grafana-Key (Key Vault grafana-proxy-key, files/grafana-proxy.conf.template) and drops that header. Only the
gateway reaches the sidecar (networkpolicies.yaml). One replica; /var/lib/grafana is an emptyDir, so users and
preferences start again after a restart, as everything else comes from the repository. Break-glass:
`kubectl port-forward deploy/grafana 3000:3000` reaches Grafana itself on the pod's loopback (deploy/azure/README.md) */ -}}
{{- if .Values.monitoring.enabled }}
{{- $name := "grafana" }}
{{- $svc := get (include "qeos.monitoringWorkloads" . | fromJson) $name }}
{{- $ctx := dict "ctx" $ "name" $name "svc" $svc "uid" 472 }}
{{- /* Key Vault: its SecretProviderClass's CSI volume, which makes the driver sync qeos-secrets-grafana */}}
{{- $keyed := include "qeos.vaultMounted" $ctx }}
{{- $secret := include "qeos.secretName" (dict "ctx" $ "name" $name) }}
{{- $images := .Values.monitoring.images }}
{{- $datasources := include "qeos.grafanaDatasources" . }}
{{- $proxyConf := .Files.Get "files/grafana-proxy.conf.template" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: qeos-grafana-provisioning
  labels:
    {{- include "qeos.labels" (dict "ctx" $ "name" $name "component" "monitoring") | nindent 4 }}
data:
  # monitoring/grafana/provisioning/dashboards/qeos.yml (a copy)
  dashboards.yml: |
    {{- .Files.Get "files/monitoring/grafana/provisioning/dashboards/qeos.yml" | nindent 4 }}
  datasources.yml: |
    {{- $datasources | nindent 4 }}
---
# monitoring/grafana/dashboards (copies), where Compose mounts them
apiVersion: v1
kind: ConfigMap
metadata:
  name: qeos-grafana-dashboards
  labels:
    {{- include "qeos.labels" (dict "ctx" $ "name" $name "component" "monitoring") | nindent 4 }}
data:
  {{- range $path, $_ := .Files.Glob "files/monitoring/grafana/dashboards/*.json" }}
  {{ base $path }}: |
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: qeos-grafana-proxy
  labels:
    {{- include "qeos.labels" (dict "ctx" $ "name" $name "component" "monitoring") | nindent 4 }}
data:
  grafana-proxy.conf.template: |
    {{- $proxyConf | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "qeos.labels" (dict "ctx" $ "name" $name "component" "monitoring") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "qeos.selector" $ctx | nindent 4 }}
  ports:
    # The gateway's GRAFANA_UPSTREAM is grafana<suffix>:3000, as on Compose; behind it, the sidecar
    - name: http
      port: {{ $svc.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "qeos.labels" (dict "ctx" $ "name" $name "component" "monitoring") | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "qeos.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- /* app.kubernetes.io/name grafana and instance <release>: the labels the cluster Prometheus's NetworkPolicy
        admits on 9090 (deploy/monitoring) */}}
        {{- include "qeos.labels" (dict "ctx" $ "name" $name "component" "monitoring") | nindent 8 }}
      annotations:
        # Provisioning is read at start (the dashboards every 60 s): a new data source or proxy rule restarts the pod
        checksum/config: {{ printf "%s%s" $datasources $proxyConf | sha256sum }}
    spec:
      serviceAccountName: {{ printf "qeos-%s" $svc.identity }}
      {{- /* The image's own user, grafana (472); the sidecar runs as nginx (101) */}}
      {{- include "qeos.podCommon" $ctx | nindent 6 }}
      containers:
        - name: grafana
          image: {{ $images.grafana }}
          imagePullPolicy: IfNotPresent
          # Compose's entrypoint: no start without an admin password (an empty one would mean admin/admin)
          command:
            - /bin/sh
            - -c
            - >-
              if [ -z "$GF_SECURITY_ADMIN_PASSWORD" ]; then
              echo 'grafana: the Key Vault secret grafana-admin-password is empty' >&2; exit 1; fi;
              exec /run.sh
          env:
            # Compose's settings (docker-compose.yml, service grafana), but the root URL, the listen address and the
            # auth proxy's whitelist: the sidecar, on the pod's loopback, is the only client Grafana believes
            - name: GF_SERVER_ROOT_URL
              value: {{ printf "%s/grafana/" (include "qeos.publicUrl" $) | quote }}
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
            - name: GF_SERVER_HTTP_ADDR
              value: 127.0.0.1
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: grafana-admin-password
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_NEWS_NEWS_FEED_ENABLED
              value: "false"
            # The gateway location carries no WebSockets (Ruling 13)
            - name: GF_LIVE_MAX_CONNECTIONS
              value: "0"
            - name: GF_PATHS_PROVISIONING
              value: /etc/qeos/grafana/provisioning
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /etc/qeos/grafana/dashboards/overview.json
            - name: GF_AUTH_PROXY_ENABLED
              value: "true"
            - name: GF_AUTH_PROXY_HEADER_NAME
              value: X-QEOS-User-Email
            - name: GF_AUTH_PROXY_HEADER_PROPERTY
              value: email
            - name: GF_AUTH_PROXY_AUTO_SIGN_UP
              value: "true"
            - name: GF_USERS_AUTO_ASSIGN_ORG_ROLE
              value: Admin
            - name: GF_AUTH_PROXY_WHITELIST
              value: 127.0.0.1
          # Grafana answers on 127.0.0.1 only, so the kubelet probes it through the sidecar's /_health (8080)
          startupProbe:
            httpGet:
              path: /_health
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /_health
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          {{- include "qeos.lifecycle" $ctx | nindent 10 }}
          securityContext:
            {{- include "qeos.containerSecurity" $ctx | nindent 12 }}
          resources:
            {{- toYaml (get .Values.monitoring.resources "grafana") | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: tmp
              mountPath: /tmp
            - name: provisioning
              mountPath: /etc/qeos/grafana/provisioning
              readOnly: true
            - name: dashboards
              mountPath: /etc/qeos/grafana/dashboards
              readOnly: true
            {{- if $keyed }}
            {{- include "qeos.secretsMount" $ctx | nindent 12 }}
            {{- end }}
        - name: grafana-proxy
          image: {{ $images.grafanaProxy }}
          imagePullPolicy: IfNotPresent
          # The key's shape is checked before nginx's entrypoint renders it into the configuration, as the gateway checks
          # it (gateway/entrypoint.sh); the refusal never prints it
          command:
            - /bin/sh
            - -c
            - >-
              case "$GRAFANA_PROXY_KEY" in *[!A-Za-z0-9_-]*) bad=1 ;; esac;
              if [ -n "$bad" ] || [ "${#GRAFANA_PROXY_KEY}" -lt 32 ] || [ "${#GRAFANA_PROXY_KEY}" -gt 128 ]; then
              echo 'grafana-proxy: the Key Vault secret grafana-proxy-key must be 32 to 128 characters of A-Z, a-z, 0-9, _ and -' >&2;
              exit 1; fi;
              exec /docker-entrypoint.sh nginx -c /etc/nginx/rendered/grafana-proxy.conf -g 'daemon off;'
          env:
            - name: GRAFANA_PROXY_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: grafana-proxy-key
            # nginx's entrypoint renders /etc/nginx/templates/*.template into this emptyDir (the configuration holds the
            # key: never in the image, a ConfigMap or a log), substituting the key only; nginx runs with it alone (-c)
            - name: NGINX_ENVSUBST_OUTPUT_DIR
              value: /etc/nginx/rendered
            - name: NGINX_ENVSUBST_FILTER
              value: ^GRAFANA_PROXY_KEY$
            - name: NGINX_ENTRYPOINT_QUIET_LOGS
              value: "1"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /_health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          # nginx itself: a Grafana that is down restarts Grafana (its liveness probe), not the sidecar
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          {{- include "qeos.lifecycle" $ctx | nindent 10 }}
          securityContext:
            {{- include "qeos.containerSecurity" $ctx | nindent 12 }}
            runAsUser: 101
            runAsGroup: 101
          resources:
            {{- toYaml (get .Values.monitoring.resources "grafana-proxy") | nindent 12 }}
          volumeMounts:
            - name: proxy-template
              mountPath: /etc/nginx/templates
              readOnly: true
            - name: proxy-conf
              mountPath: /etc/nginx/rendered
            - name: proxy-tmp
              mountPath: /tmp
      volumes:
        # Grafana's database (users the auth proxy signs up, preferences) and downloaded plugins: lost on a restart
        - name: data
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: provisioning
          configMap:
            name: qeos-grafana-provisioning
            items:
              - key: dashboards.yml
                path: dashboards/qeos.yml
              - key: datasources.yml
                path: datasources/prometheus.yml
        - name: dashboards
          configMap:
            name: qeos-grafana-dashboards
        - name: proxy-template
          configMap:
            name: qeos-grafana-proxy
        # The rendered configuration holds the key: in memory, never on the node's disk
        - name: proxy-conf
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: proxy-tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- if $keyed }}
        {{- include "qeos.secretsVolume" $ctx | nindent 8 }}
        {{- end }}
{{- end }}

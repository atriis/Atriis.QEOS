{{- /* Key Vault through the Secrets Store CSI driver (secrets.source keyvault): one SecretProviderClass per workload
identity, holding the keys its workloads read and syncing them into the Secret qeos-secrets-<identity> that their
secretKeyRefs name. The driver syncs only while some pod mounts the volume, so every such pod mounts it */ -}}
{{- if eq .Values.secrets.source "keyvault" }}
{{- $byIdentity := dict }}
{{- range $name, $svc := .Values.services }}
{{- if $svc.identity }}
{{- $keys := get $byIdentity $svc.identity | default list }}
{{- range $env, $key := include "qeos.secretRefs" (dict "ctx" $ "svc" $svc) | fromJson }}
{{- $keys = append $keys $key }}
{{- end }}
{{- $_ := set $byIdentity $svc.identity $keys }}
{{- end }}
{{- end }}
{{- range $identity := keys $byIdentity | sortAlpha }}
{{- $keys := list }}
{{- range $key := get $byIdentity $identity | uniq | sortAlpha }}
{{- if not (has $key $.Values.keyvault.absent) }}
{{- $keys = append $keys $key }}
{{- end }}
{{- end }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ printf "qeos-%s" $identity }}
  labels:
    {{- include "qeos.labels" (dict "ctx" $ "name" (printf "qeos-%s" $identity) "component" "identity") | nindent 4 }}
spec:
  provider: azure
  parameters:
    {{- include "qeos.keyvaultParameters" (dict "ctx" $ "identity" $identity "keys" $keys) | nindent 4 }}
  secretObjects:
    - secretName: {{ printf "qeos-secrets-%s" $identity }}
      type: Opaque
      data:
        {{- range $key := $keys }}
        - objectName: {{ $key }}
          key: {{ $key }}
        {{- end }}
{{- end }}
{{- end }}

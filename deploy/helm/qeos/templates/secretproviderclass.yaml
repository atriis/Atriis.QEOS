{{- /* Key Vault through the Secrets Store CSI driver (secrets.source keyvault): one SecretProviderClass per workload, named
qeos-<workload>, holding only the keys that workload reads (its own database password, never another's) and syncing
them into the Secret qeos-secrets-<workload> that its secretKeyRefs name. Workloads sharing a workload identity share
its clientID. The driver syncs only while some pod mounts the volume, so every such pod mounts it */ -}}
{{- if eq .Values.secrets.source "keyvault" }}
{{- range $name, $svc := .Values.services }}
{{- $keys := list }}
{{- range $env, $key := include "qeos.secretRefs" (dict "ctx" $ "svc" $svc) | fromJson }}
{{- if not (has $key $.Values.keyvault.absent) }}
{{- $keys = append $keys $key }}
{{- end }}
{{- end }}
{{- if $keys }}
{{- $keys = $keys | uniq | sortAlpha }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ printf "qeos-%s" $name }}
  labels:
    {{- include "qeos.labels" (dict "ctx" $ "name" $name "component" "secrets") | nindent 4 }}
spec:
  provider: azure
  parameters:
    {{- include "qeos.keyvaultParameters" (dict "ctx" $ "identity" (required (printf "services.%s.identity is required: it reads secrets" $name) $svc.identity) "keys" $keys) | nindent 4 }}
  secretObjects:
    - secretName: {{ printf "qeos-secrets-%s" $name }}
      type: Opaque
      data:
        {{- range $key := $keys }}
        - objectName: {{ $key }}
          key: {{ $key }}
        {{- end }}
{{- end }}
{{- end }}
{{- end }}

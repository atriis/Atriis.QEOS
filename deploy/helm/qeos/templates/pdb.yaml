{{- /* A node drain or upgrade never takes the last pod of a 2-replica workload (Global Constraints) */ -}}
{{- range $name, $svc := .Values.services }}
{{- if ge (int $svc.replicas) 2 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "qeos.labels" (dict "ctx" $ "name" $name "component" $svc.kind) | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "qeos.selector" (dict "ctx" $ "name" $name) | nindent 6 }}
{{- end }}
{{- end }}

# QEOS on Kubernetes (ADR-038). Defaults only: no environment, hostname or secret lives here. Each environment adds its
# own file (values-ci.yaml for kind in CI, values-staging.yaml for AKS staging) and the deploy workflow passes what Bicep
# outputs with --set. deploy/helm/README.md describes every value.

image:
  # Empty: qeos/<service>:<tag> (what kind loads); on AKS the ACR login server, e.g. <acr>.azurecr.io
  registry: ""
  # Required: the git SHA (or platform-v* version) the images were built from. Also reported as QEOS_COMMIT
  tag: ""
  pullPolicy: IfNotPresent

# Required: the address users and collectors reach, https://<host> with no path. BASE_URL and DASHBOARD_URL follow it
publicUrl: ""

# Appended to every service name the gateway proxies to (UPSTREAM_SUFFIX) and to the internal URLs. Empty: the release
# namespace's ".<namespace>.svc.cluster.local" (nginx's resolver does not use the search domains)
namespaceSuffix: ""

# QEOS_VERSION in build_info; empty: the chart's appVersion
version: ""

secrets:
  # keyvault: Key Vault through the Secrets Store CSI driver: one SecretProviderClass per workload, holding only the keys
  # it reads, synced into its own Secret qeos-secrets-<workload>
  # kubernetes: an existing Secret (name below) holding every key, created outside the chart (kind in CI)
  source: keyvault
  name: qeos-secrets
  # Keys a pod may start without (their setting then stays empty)
  optional:
    - tm-secrets-key
    - smtp-user
    - smtp-password
    # Alertmanager's channels (monitoring.enabled): without them alerts go to the null receiver
    - alert-slack-webhook-url
    - alert-teams-webhook-url

keyvault:
  name: ""
  tenantId: ""
  # Client ids of the user-assigned managed identities (Bicep output workloadIdentityClientIds). Each one has a
  # federated credential for its ServiceAccount, qeos-<identity>; per-workload SecretProviderClasses share them
  clientIds:
    services: ""
    ingestion: ""
    ingestion-retention: ""
    migrate: ""
  # Optional keys (secrets.optional) that the vault does not hold: left out of the SecretProviderClasses, whose mount
  # would otherwise fail
  absent: []

postgres:
  # Required: the server's host name (Flexible Server: <name>.postgres.database.azure.com)
  host: ""
  # The admin login, used only by the migration hook (db-init); its password is the key postgres-admin-password
  adminUser: qeosadmin
  # libpq's PGSSLMODE for every connection; Flexible Server requires TLS
  sslmode: require
  # psql for db-init (\getenv needs psql 15 or newer)
  clientImage: postgres:16.15

artifacts:
  # s3 (MinIO or any S3 API, keys artifacts-s3-access-key and artifacts-s3-secret-key) or azure (Blob, workload identity)
  backend: s3
  s3:
    endpoint: ""
    bucket: qeos-artifacts
  azure:
    accountUrl: ""
    container: qeos-artifacts

# Outgoing email, non-secret part; the user and password are the keys smtp-user and smtp-password. Empty host: no email
smtp:
  host: ""
  port: 587
  tls: true
  fromEmail: ""
  fromName: QEOS
  # SMTP_REQUIRE_LOGIN: the server takes signed-in mail only (Azure Communication Services), so without smtp-user and
  # smtp-password the services log the links instead of sending them (qeos_shared.mail)
  requireLogin: true

# Monitoring (ADR-027, ADR-038 Stage 2): ServiceMonitors and PrometheusRules for the cluster's kube-prometheus-stack
# (deploy/monitoring, installed first by a cluster admin; without its CRDs a render with monitoring on fails),
# postgres-exporter, Alertmanager and Grafana, as Compose's monitoring profile. The Prometheus pods' namespace and labels
# are networkPolicy.prometheus's. Needs the Key Vault keys monitoring-db-password, grafana-admin-password and
# grafana-proxy-key (the gateway sends it, Grafana's grafana-proxy sidecar checks it)
monitoring:
  enabled: false
  # Grafana's data source; empty: http://qeos-monitoring-prometheus.<networkPolicy.prometheus.namespace>.svc.cluster.local:9090
  prometheusUrl: ""
  # Compose's rule groups (monitoring/prometheus/alerts.yml) left out on Kubernetes, where kube-prometheus-stack's own
  # rules cover them: qeos-host reads node-exporter and cAdvisor's Compose jobs, which do not exist here (and namespace
  # enforcement would hide node series from it); qeos-containers counts start times per container series, and a
  # restarted pod's container is a new series here, so it could never fire (KubePodCrashLooping does)
  skipRuleGroups:
    - qeos-host
    - qeos-containers
  # PostgresDatabaseGrowing fires above this many GB per database (Compose: POSTGRES_DB_SIZE_ALERT_GB)
  postgresDbSizeAlertGb: 20
  # Alertmanager's email channel (Compose: ALERT_EMAIL_TO), sent through smtp.*; empty: no email. Slack and Teams are
  # the optional Key Vault keys alert-slack-webhook-url and alert-teams-webhook-url. No channel: the null receiver
  alertEmailTo: ""
  # The workload identity of postgres-exporter's, Alertmanager's and Grafana's SecretProviderClasses (keyvault.clientIds)
  identity: services
  # Exactly as docker-compose.yml pins them; grafanaProxy is the gateway's base image and digest (gateway/Dockerfile)
  images:
    alertmanager: prom/alertmanager:v0.28.1
    postgresExporter: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    grafana: grafana/grafana:12.0.2
    grafanaProxy: nginxinc/nginx-unprivileged:1.30-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
  # Limits start from Compose's mem_limit (64m for Alertmanager and postgres-exporter, 256m for Grafana)
  resources:
    grafana:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    grafana-proxy:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 200m
        memory: 64Mi
    alertmanager:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 64Mi
    postgres-exporter:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 64Mi

gateway:
  # Required: the edge's address range (space-separated CIDRs); the gateway believes X-Forwarded-For from it only
  trustedProxies: ""
  # Per client IP and per gateway pod: half of Compose's, since two pods serve (Global Constraints)
  rates:
    auth: 3r/s
    api: 10r/s
    collect: 5r/s
    collectBlobs: 25r/s
    collectArtifacts: 5r/s
  importMaxBody: 25m

# The edge in front of the gateway (spec 5.4): a Gateway API Gateway of AKS Application Routing's Istio implementation
# that ends TLS, an HTTPRoute to the gateway Service, and a cert-manager Issuer and Certificate (Let's Encrypt, HTTP-01).
# deploy/helm/README.md, "The edge"
edge:
  # Render the Gateway, the HTTPRoutes, the Issuer and the Certificate (AKS; needs the add-on and cert-manager)
  enabled: false
  # The namespace of the edge's proxy pods, the only ones the gateway accepts traffic from (NetworkPolicy gateway-ingress).
  # The add-on runs them in the Gateway's own namespace, which is the release's. Empty: the release namespace
  namespace: ""
  gatewayClassName: approuting-istio
  # The static public IP the Gateway's LoadBalancer Service takes (Bicep: pip-<aksName>-edge in the environment's
  # resource group); both required with edge.enabled
  publicIp:
    name: ""
    resourceGroup: ""
  acme:
    # Required with edge.enabled: Let's Encrypt's contact for expiry and account notices
    email: ""
    # Let's Encrypt production; https://acme-staging-v02.api.letsencrypt.org/directory for untrusted test certificates
    server: https://acme-v02.api.letsencrypt.org/directory

# Ingress NetworkPolicies (templates/networkpolicies.yaml): every pod of the release denied by default, each Service
# open to its callers only (services.<x>.urls, and the gateway to the APIs and the dashboard). Egress stays open
networkPolicy:
  enabled: true
  # The Prometheus pods that scrape the APIs on 8000 (kube-prometheus-stack, deploy/monitoring): their namespace, by
  # name, and their pod labels. The single source of the monitoring namespace. Used (and required) with
  # monitoring.enabled only
  prometheus:
    namespace: qeos-monitoring
    podLabels:
      app.kubernetes.io/name: prometheus

migrate:
  # The order the hook Job runs each service's migrations in, after db-init
  order:
    - auth-service
    - organization-service
    - project-service
    - ingestion-service
    - test-management-service
  # Empty: image.tag. CI sets a missing tag to prove a failed migration leaves the release as it was
  imageTag: ""
  # A migration that runs longer fails the release
  activeDeadlineSeconds: 900
  backoffLimit: 0
  # Each hook container (db-init, every migration)
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# In-cluster PostgreSQL and MinIO for kind (values-ci.yaml); never on AKS
ci:
  backing: false
  # The major Flexible Server runs (deploy/azure/modules/postgres.bicep)
  postgresImage: postgres:16.15
  # The same image and digest as docker-compose.yml
  minioImage: cgr.dev/chainguard/minio@sha256:709099319add48dfb44aa596a7070d3ddd8dd04d7ae881765719aec29df9e510

# Starting requests and limits per workload: estimates, not yet measured on a running cluster (deploy/helm/README.md)
apiResources: &apiResources
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi
loopResources: &loopResources
  requests:
    cpu: 50m
    memory: 192Mi
  limits:
    cpu: 500m
    memory: 512Mi
nginxResources: &nginxResources
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 128Mi

# Every workload, named as in docker-compose.yml (the Kubernetes Service names equal the Compose names). Fields:
#   kind        api | loop | dashboard | gateway: the template that renders it
#   image       qeos/<image> (default: the key)
#   database    <database>_db, reached as role <database>_app with the key <database>-db-password
#   appDir      the image's service directory (alembic.ini), for the API's wait-for-schema init container
#   identity    the workload identity (keyvault.clientIds): its ServiceAccount, qeos-<identity>
#   azureSdk    the pod calls Azure with the SDK (Blob): it gets the workload identity webhook's label, which injects
#               AZURE_CLIENT_ID / AZURE_TENANT_ID. Never on auth-service, whose AZURE_* are its Entra sign-in app
#   secretEnv   env var -> secret key (Key Vault secret name)
#   urls        env var -> service: http://<service><suffix>:8000
#   publicUrlEnv env vars set to publicUrl
#   smtp, artifacts, monitoring   add the SMTP, artifact storage or MONITORING_ENABLED settings
#   metricsJob  (APIs) Prometheus's job label for its /metrics, Compose's scrape job name (label qeos.io/metrics-job)
#   metricsHonorLabels  (APIs) keep the scraped series' own job label (ingestion: the loop jobs' heartbeats)
#   waitFor     (loop jobs) services whose /health must answer 200 before the job starts: Compose's depends_on with
#               condition service_healthy (an init container, files/wait-for.py); each must be one of its urls
#   env         plain settings, last (they win)
services:
  auth-service:
    kind: api
    metricsJob: auth
    database: auth
    appDir: /app/platforms/auth-service/auth-service
    identity: services
    replicas: 2
    resources: *apiResources
    smtp: true
    monitoring: true
    publicUrlEnv: [BASE_URL]
    urls:
      ORGANIZATION_SERVICE_URL: organization-service
    secretEnv:
      SECRET_KEY: secret-key
      INTERNAL_API_PASSWORD: internal-api-password
      ORGANIZATION_INTERNAL_API_PASSWORD: internal-api-password
      SMTP_USER: smtp-user
      SMTP_PASSWORD: smtp-password
    env:
      AZURE_CLIENT_ID: ""
      AZURE_TENANT_ID: ""
      AZURE_ALLOWED_TENANTS: ""
      AUTH_SSO_ONLY: "false"
      AUTH_SSO_PROVIDERS: microsoft

  organization-service:
    kind: api
    metricsJob: organization
    database: organization
    appDir: /app/platforms/organization-service
    identity: services
    replicas: 2
    resources: *apiResources
    urls:
      AUTH_SERVICE_URL: auth-service
    secretEnv:
      SECRET_KEY: secret-key
      INTERNAL_API_PASSWORD: internal-api-password
    env: {}

  project-service:
    kind: api
    metricsJob: project
    database: project
    appDir: /app/platforms/project-service
    identity: services
    replicas: 2
    resources: *apiResources
    urls:
      ORGANIZATION_SERVICE_URL: organization-service
    secretEnv:
      SECRET_KEY: secret-key
      INTERNAL_API_PASSWORD: internal-api-password
    env:
      PROJECT_DELETE_GRACE_DAYS: "7"

  ingestion-service:
    kind: api
    metricsJob: ingestion
    metricsHonorLabels: true
    database: ingestion
    appDir: /app/platforms/ingestion-service
    identity: ingestion
    azureSdk: true
    replicas: 2
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        cpu: "1"
        memory: 1Gi
    smtp: true
    artifacts: true
    publicUrlEnv: [DASHBOARD_URL]
    urls:
      PROJECT_SERVICE_URL: project-service
      PROJECT_SERVICE_INTERNAL_URL: project-service
    secretEnv:
      SECRET_KEY: secret-key
      INTERNAL_API_PASSWORD: internal-api-password
      SMTP_USER: smtp-user
      SMTP_PASSWORD: smtp-password
    env: {}

  test-management-service:
    kind: api
    metricsJob: test-management
    database: testmgmt
    appDir: /app/platforms/test-management-service
    identity: services
    replicas: 2
    resources: *apiResources
    urls:
      PROJECT_SERVICE_URL: project-service
    secretEnv:
      SECRET_KEY: secret-key
      INTERNAL_API_PASSWORD: internal-api-password
      TM_SECRETS_KEY: tm-secrets-key
    env:
      IMPORT_MAX_FILES: "2000"
      IMPORT_MAX_FILE_BYTES: "262144"
      IMPORT_MAX_TOTAL_BYTES: "10485760"

  # The loop jobs run the ingestion image; PostgreSQL advisory locks make a second copy harmless
  ingestion-retention:
    kind: loop
    image: ingestion-service
    command: ["python", "-m", "src.ingestion.jobs.retention", "--loop"]
    # Its first pass reads the policies from project-service (Compose: service_healthy); test-management only started
    waitFor: [project-service]
    database: ingestion
    identity: ingestion-retention
    azureSdk: true
    replicas: 1
    resources: *loopResources
    smtp: true
    artifacts: true
    publicUrlEnv: [DASHBOARD_URL]
    urls:
      PROJECT_SERVICE_URL: project-service
      PROJECT_SERVICE_INTERNAL_URL: project-service
      TEST_MANAGEMENT_INTERNAL_URL: test-management-service
    secretEnv:
      SECRET_KEY: secret-key
      INTERNAL_API_PASSWORD: internal-api-password
      SMTP_USER: smtp-user
      SMTP_PASSWORD: smtp-password
    env:
      PROJECT_DELETE_GRACE_DAYS: "7"

  analytics-rollup:
    kind: loop
    image: ingestion-service
    command: ["python", "-m", "src.ingestion.jobs.rollup", "--loop"]
    database: ingestion
    identity: services
    replicas: 1
    resources: *loopResources
    smtp: true
    publicUrlEnv: [DASHBOARD_URL]
    urls:
      PROJECT_SERVICE_URL: project-service
      PROJECT_SERVICE_INTERNAL_URL: project-service
    secretEnv:
      SECRET_KEY: secret-key
      INTERNAL_API_PASSWORD: internal-api-password
      SMTP_USER: smtp-user
      SMTP_PASSWORD: smtp-password
    env: {}

  impact-rollup:
    kind: loop
    image: ingestion-service
    command: ["python", "-m", "src.ingestion.jobs.impact_rollup", "--loop"]
    database: ingestion
    identity: services
    replicas: 1
    resources: *loopResources
    smtp: true
    publicUrlEnv: [DASHBOARD_URL]
    urls:
      PROJECT_SERVICE_URL: project-service
      PROJECT_SERVICE_INTERNAL_URL: project-service
    secretEnv:
      SECRET_KEY: secret-key
      INTERNAL_API_PASSWORD: internal-api-password
      SMTP_USER: smtp-user
      SMTP_PASSWORD: smtp-password
    env: {}

  weekly-summary:
    kind: loop
    image: ingestion-service
    command: ["python", "-m", "src.ingestion.jobs.weekly_summary", "--loop"]
    database: ingestion
    identity: services
    replicas: 1
    resources: *loopResources
    smtp: true
    publicUrlEnv: [DASHBOARD_URL]
    urls:
      PROJECT_SERVICE_URL: project-service
      PROJECT_SERVICE_INTERNAL_URL: project-service
    secretEnv:
      SECRET_KEY: secret-key
      INTERNAL_API_PASSWORD: internal-api-password
      SMTP_USER: smtp-user
      SMTP_PASSWORD: smtp-password
    env: {}

  dashboard:
    kind: dashboard
    replicas: 2
    resources: *nginxResources
    # Written to /config.js at start (dashboard/README.md); empty keeps the values built into the image
    env:
      GOOGLE_CLIENT_ID: ""
      MSAL_CLIENT_ID: ""
      MSAL_AUTHORITY: ""

  gateway:
    kind: gateway
    replicas: 2
    resources: *nginxResources
    monitoring: true
    # Read only with monitoring.enabled (GRAFANA_PROXY_KEY <- grafana-proxy-key): the workload identity of its
    # SecretProviderClass and ServiceAccount
    identity: services
    env: {}

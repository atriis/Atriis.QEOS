# AKS staging (ADR-038). Nothing here names a real host or holds a secret: the deploy workflow (.github/workflows/
# deploy-aks.yml) passes Bicep's outputs with --set from the GitHub environment staging's variables: image.registry,
# image.tag, publicUrl (https://<stagingHostname>), keyvault.name, keyvault.tenantId, keyvault.clientIds.*,
# postgres.host, artifacts.azure.accountUrl and .container, smtp.fromEmail, edge.publicIp.* and edge.acme.email.

# Required, from the workflow: https://<stagingHostname>, the edge's Azure-provided DNS name
publicUrl: ""

secrets:
  source: keyvault

keyvault:
  # Optional keys staging's vault does not hold yet. smtp-user and smtp-password: remove both once the ACS SMTP
  # application exists and its secrets are in the vault (deploy/azure/README.md, section 4.1); until then the chart
  # leaves SMTP_HOST empty and verification links appear in the auth-service log
  absent:
    - tm-secrets-key
    - smtp-user
    - smtp-password
    # Alertmanager's Slack and Teams channels: add a webhook to the vault, then remove its key here
    - alert-slack-webhook-url
    - alert-teams-webhook-url

postgres:
  adminUser: qeosadmin
  sslmode: require

artifacts:
  backend: azure

# Azure Communication Services Email over SMTP (STARTTLS on 587); the sender comes from the workflow
smtp:
  host: smtp.azurecomm.net
  port: 587
  tls: true

gateway:
  # The edge's proxy pods get their addresses from the cluster's pod range: Azure CNI Overlay's, which Bicep sets
  # (main.bicep podCidr; scripts/tests/test_azure_bicep.py keeps them equal). Change both together
  trustedProxies: 10.244.0.0/16
  # gateway.rates: values.yaml's halved defaults (per client IP and per gateway pod; the edge enforces no limit of its own)

# The Gateway, its routes and certificate; edge.namespace stays empty: the add-on runs the proxy pods in the Gateway's
# namespace, the release's
edge:
  enabled: true

networkPolicy:
  enabled: true

# A cluster admin installs deploy/monitoring first (deploy/monitoring/README.md); Key Vault holds monitoring-db-password
# and grafana-proxy-key (deploy/azure/init-secrets.sh)
monitoring:
  enabled: true

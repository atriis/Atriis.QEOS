name: Deploy to AKS

# Deploys the Helm chart (deploy/helm/qeos) to an AKS environment (ADR-038, spec 5.8). Staging: automatically after
# "Build platform images" pushed master's images, or by hand. Production: a later stage (its values file does not exist
# yet), so choosing it fails at once. deploy/helm/README.md, "The deploy workflow", lists the variables it reads.
on:
  workflow_run:
    workflows: [ "Build platform images" ]
    types: [ completed ]
    branches: [ master ]
  workflow_dispatch:
    inputs:
      environment:
        description: The AKS environment
        type: choice
        options: [ staging, production ]
        default: staging
      tag:
        description: The images' tag, a full git SHA on master or a platform version (1.2.3)
        type: string
        required: true
      allow_rollback:
        description: Deploy even when the tag is older than what the environment runs (a deliberate rollback)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  target:
    name: Choose what to deploy
    # The real guard is upstream: "Build platform images" builds only after a green CI run of a push to this repository
    # (its own `if`), and only a run of it that concluded success gets here. The checks below repeat what the trigger
    # already filters (the branch) or what holds for every workflow_run-triggered run (the repository): keep them, but
    # never replace the conclusion check or build-platform's guard with them. A build run that pushed nothing (Azure not
    # configured, all jobs skipped) leaves no built-sha artifact, and nothing is deployed
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'workflow_run' &&
        github.event.workflow_run.head_branch == 'master' &&
        github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # The triggering build run's artifact
      actions: read
    outputs:
      deploy: ${{ steps.target.outputs.deploy }}
      environment: ${{ steps.target.outputs.environment }}
      tag: ${{ steps.target.outputs.tag }}
      ref: ${{ steps.target.outputs.ref }}
    steps:
      # The exact commit the build pushed images for (build-platform.yml, job built), never master's tip of the moment
      - name: Get the built commit
        if: github.event_name == 'workflow_run'
        id: built
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: built-sha
          path: ${{ runner.temp }}/built
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # master's history, to check that what is deployed is on it
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Check the environment and the tag
        id: target
        env:
          ENVIRONMENT: ${{ inputs.environment || 'staging' }}
          INPUT_TAG: ${{ inputs.tag }}
          BUILT_FILE: ${{ runner.temp }}/built/built-sha.txt
          BUILT_OUTCOME: ${{ steps.built.outcome }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$ENVIRONMENT" != staging ]; then
            echo "::error::Only staging can be deployed now: production (values-production.yaml, the production cluster and its approval) is a later stage (spec 5.11)"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            if [ ! -s "$BUILT_FILE" ]; then
              # The download fails both when the run has no such artifact (the build pushed nothing) and for any other
              # reason (an API error, an expired artifact): only the run's artifact list tells them apart
              names="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID/artifacts" \
                --jq '[.artifacts[] | select(.name == "built-sha") | .name + (if .expired then " (expired)" else "" end)] | join(",")' 2>&1)" \
                || names="listing failed: $names"
              if [ "$BUILT_OUTCOME" != failure ] || [ -z "$names" ]; then
                echo "::notice::The build pushed no images (no built-sha artifact): nothing to deploy"
              else
                echo "::warning::Nothing deployed: the built-sha artifact of build run $BUILD_RUN_ID could not be downloaded (download step: $BUILT_OUTCOME; artifact: $names). Deploy by hand (Run workflow, tag = the build's commit) once the cause is fixed"
              fi
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            tag="$(tr -d '[:space:]' < "$BUILT_FILE")"
          else
            tag="$INPUT_TAG"
          fi
          # Images are tagged with the full SHA (master) and, for platform-v* tags, with the version too (build-platform.yml)
          if [[ "$tag" =~ ^[0-9a-f]{40}$ ]]; then
            ref="$tag"
          elif [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            ref="platform-v$tag"
          else
            echo "::error::tag must be a full git SHA (40 hex characters) or a platform version like 1.2.3, got '$tag'"
            exit 1
          fi
          # Only what master has is deployed: a SHA or tag from another branch stops here
          if ! git rev-parse --verify --quiet "$ref^{commit}" >/dev/null; then
            echo "::error::$ref is not in this repository"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$ref^{commit}" origin/master; then
            echo "::error::$ref is not on master"
            exit 1
          fi
          {
            echo "deploy=true"
            echo "environment=$ENVIRONMENT"
            echo "tag=$tag"
            echo "ref=$ref"
          } >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy (${{ needs.target.outputs.environment }})
    needs: target
    if: needs.target.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    # Every step that waits has its own budget (the runner's authorised range 15 minutes, helm 25, the edge 20), so the
    # removal of the runner's address always has its 25 minutes left: JOB_TIMEOUT_MINUTES below must equal this
    timeout-minutes: 100
    # One deploy per environment at a time: each run adds its runner's address to the API server's authorised ranges
    # and removes it afterwards, and two runs editing that list at once would undo each other's change. On the job, not
    # the workflow: a run whose target is skipped never joins the group, so it cannot cancel a pending real deploy
    concurrency:
      group: deploy-aks-${{ needs.target.outputs.environment }}
      cancel-in-progress: false
    # Its variables and its deployment-branch policy (master only; deploy/azure/README.md, section 5.1). The deploy
    # identity's federated credential trusts repo:<org>/<repo>:environment:<name> and nothing else, and its client id is
    # a variable of the environment, so only a job that declares the environment can sign in as it
    environment: ${{ needs.target.outputs.environment }}
    permissions:
      contents: read
      # The OIDC token azure/login exchanges for an Azure access token (no stored secret)
      id-token: write
    env:
      ENVIRONMENT: ${{ needs.target.outputs.environment }}
      TAG: ${{ needs.target.outputs.tag }}
      # The commit (or platform-v* tag) TAG names
      REF: ${{ needs.target.outputs.ref }}
      # Automatic runs never roll back; a manual one may, when asked
      ALLOW_ROLLBACK: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_rollback }}
      NAMESPACE: qeos
      CHART: deploy/helm/qeos
      # kubectl and kubelogin, pinned with their checksums (local accounts are off: kubectl signs in through kubelogin)
      KUBECTL_VERSION: v1.36.4
      KUBECTL_SHA256: 8b8f088da2dab964f853b38464033b1be15ede2839eca751482357c45abdd05a
      KUBELOGIN_VERSION: v0.2.20
      KUBELOGIN_SHA256: 2e92450a929dd2aec4da818b40dd4fda97aaeae2d6cd9c1074cc1371210f4ab9
      JOB_TIMEOUT_MINUTES: 100
      # The GitHub environment's variable (never a repository variable): the deploy identity, which can change the
      # cluster. build-platform.yml signs in as the build identity (AZURE_BUILD_CLIENT_ID, AcrPush only)
      AZURE_DEPLOY_CLIENT_ID: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
      # Repository variables (build-platform.yml uses them too)
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      # The GitHub environment's variables: Bicep's outputs (deploy/azure/README.md, section 5) and the ACME contact
      AKS_NAME: ${{ vars.AKS_NAME }}
      AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
      KEY_VAULT_NAME: ${{ vars.KEY_VAULT_NAME }}
      POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
      STORAGE_ACCOUNT_URL: ${{ vars.STORAGE_ACCOUNT_URL }}
      ARTIFACTS_CONTAINER: ${{ vars.ARTIFACTS_CONTAINER }}
      WORKLOAD_IDENTITY_CLIENT_IDS: ${{ vars.WORKLOAD_IDENTITY_CLIENT_IDS }}
      EMAIL_SENDER: ${{ vars.EMAIL_SENDER }}
      PUBLIC_HOSTNAME: ${{ vars.PUBLIC_HOSTNAME }}
      ACME_EMAIL: ${{ vars.ACME_EMAIL }}
    steps:
      # Safe to merge before Azure exists: the automatic run only prints a notice; a manual one fails. A value that is
      # set but malformed always fails, before anything touches the cluster
      - name: Check the configuration
        id: azure
        run: |
          # The cleanup's deadline counts from here (the job's start, near enough)
          echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          missing=()
          for name in AZURE_DEPLOY_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID ACR_NAME AKS_NAME AKS_RESOURCE_GROUP \
                      KEY_VAULT_NAME POSTGRES_HOST STORAGE_ACCOUNT_URL ARTIFACTS_CONTAINER WORKLOAD_IDENTITY_CLIENT_IDS \
                      EMAIL_SENDER PUBLIC_HOSTNAME ACME_EMAIL; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
              echo "::notice::Skipping the deploy: variable(s) ${missing[*]} not set for $ENVIRONMENT (Azure is not configured yet)"
              echo "configured=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Variable(s) ${missing[*]} not set (repository, or the GitHub environment $ENVIRONMENT)"
            exit 1
          fi
          bad=()
          # Bicep's workloadIdentityClientIds: one client id (a GUID) per workload identity, nothing missing or null
          guid='^[0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$'
          jq -e --arg guid "$guid" '. as $ids | type == "object" and
            all(("services", "ingestion", "ingestion-retention", "migrate"); ($ids[.] | type == "string" and test($guid)))' \
            <<< "$WORKLOAD_IDENTITY_CLIENT_IDS" >/dev/null 2>&1 \
            || bad+=("WORKLOAD_IDENTITY_CLIENT_IDS (a JSON object with a client id for services, ingestion, ingestion-retention and migrate)")
          [[ "$AZURE_TENANT_ID" =~ $guid ]] || bad+=("AZURE_TENANT_ID (a GUID)")
          [[ "$AZURE_DEPLOY_CLIENT_ID" =~ $guid ]] || bad+=("AZURE_DEPLOY_CLIENT_ID (a GUID)")
          [[ "$STORAGE_ACCOUNT_URL" =~ ^https://[a-z0-9]+\.blob\.core\.windows\.net/?$ ]] || bad+=("STORAGE_ACCOUNT_URL (https://<account>.blob.core.windows.net)")
          [[ "$PUBLIC_HOSTNAME" =~ ^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$ ]] || bad+=("PUBLIC_HOSTNAME (a host name, no scheme or path)")
          [[ "$POSTGRES_HOST" =~ ^[a-z0-9.-]+$ ]] || bad+=("POSTGRES_HOST (a host name)")
          [[ "$ACME_EMAIL" =~ ^[^@[:space:]]+@[^@[:space:]]+$ ]] || bad+=("ACME_EMAIL (an email address)")
          [[ "$EMAIL_SENDER" =~ ^[^@[:space:]]+@[^@[:space:]]+$ ]] || bad+=("EMAIL_SENDER (an email address)")
          for name in ACR_NAME AKS_NAME AKS_RESOURCE_GROUP KEY_VAULT_NAME ARTIFACTS_CONTAINER; do
            [[ "${!name}" =~ ^[A-Za-z0-9._-]+$ ]] || bad+=("$name (a resource name)")
          done
          if [ "${#bad[@]}" -gt 0 ]; then
            printf '::error::Malformed variable: %s\n' "${bad[@]}"
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      # The chart of the commit the images were built from; all history, to compare it with what is deployed
      - uses: actions/checkout@v7
        if: steps.azure.outputs.configured == 'true'
        with:
          ref: ${{ needs.target.outputs.ref }}
          fetch-depth: 0

      - uses: azure/setup-helm@v5
        if: steps.azure.outputs.configured == 'true'
        with:
          version: v3.16.4

      - name: Install kubectl and kubelogin
        if: steps.azure.outputs.configured == 'true'
        run: |
          bin="$HOME/.local/bin"
          mkdir -p "$bin"
          curl -fsSLo "$RUNNER_TEMP/kubectl" "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl"
          echo "$KUBECTL_SHA256  $RUNNER_TEMP/kubectl" | sha256sum -c -
          install -m 755 "$RUNNER_TEMP/kubectl" "$bin/kubectl"
          curl -fsSLo "$RUNNER_TEMP/kubelogin.zip" \
            "https://github.com/Azure/kubelogin/releases/download/$KUBELOGIN_VERSION/kubelogin-linux-amd64.zip"
          echo "$KUBELOGIN_SHA256  $RUNNER_TEMP/kubelogin.zip" | sha256sum -c -
          unzip -q -o "$RUNNER_TEMP/kubelogin.zip" -d "$RUNNER_TEMP/kubelogin"
          install -m 755 "$RUNNER_TEMP/kubelogin/bin/linux_amd64/kubelogin" "$bin/kubelogin"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Sign in to Azure
        if: steps.azure.outputs.configured == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ env.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      # A second guard after the built-sha artifact: a tag whose seven images are not all in ACR stops here, not after
      # 20 minutes of ImagePullBackOff and a rollback
      - name: Check that every image exists
        if: steps.azure.outputs.configured == 'true'
        run: |
          # deploy/images.txt of the commit deployed: the first word of each line that is not a comment
          [ -s deploy/images.txt ] || { echo "::error::$REF has no deploy/images.txt: deploy a newer commit"; exit 1; }
          mapfile -t images < <(awk '!/^[[:space:]]*(#|$)/ {print $1}' deploy/images.txt)
          [ "${#images[@]}" -gt 0 ] || { echo "::error::deploy/images.txt lists no image"; exit 1; }
          missing=()
          for name in "${images[@]}"; do
            az acr repository show --name "$ACR_NAME" --image "qeos/$name:$TAG" --output none 2>/dev/null \
              || missing+=("qeos/$name:$TAG")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Not in $ACR_NAME: ${missing[*]}"
            exit 1
          fi

      - name: Check that the cluster is running
        if: steps.azure.outputs.configured == 'true'
        run: |
          state="$(az aks show -g "$AKS_RESOURCE_GROUP" -n "$AKS_NAME" --query powerState.code -o tsv)"
          if [ "$state" != Running ]; then
            echo "::error::$AKS_NAME is $state: start it first (deploy/azure/README.md, section 6)"
            exit 1
          fi

      - name: Get the cluster's credentials
        if: steps.azure.outputs.configured == 'true'
        run: |
          kubeconfig="$RUNNER_TEMP/kubeconfig"
          az aks get-credentials -g "$AKS_RESOURCE_GROUP" -n "$AKS_NAME" --file "$kubeconfig" --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli --kubeconfig "$kubeconfig"
          echo "KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"

      # The helpers both authorised-range steps source (a step's shell functions do not reach the next step)
      - name: Write the cluster helpers
        if: steps.azure.outputs.configured == 'true'
        run: |
          cat > "$RUNNER_TEMP/aks-helpers.sh" <<'EOF'
          # wait_idle DEADLINE: returns 0 once no operation runs on the cluster (an update, an upgrade), 1 at DEADLINE
          # (epoch seconds). A failed read is retried like a busy cluster, so one transient az error ends nothing
          wait_idle() {
            local state=""
            while [ "$(date +%s)" -lt "$1" ]; do
              if state="$(az aks show -g "$AKS_RESOURCE_GROUP" -n "$AKS_NAME" --query provisioningState -o tsv 2>&1)"; then
                case "$state" in Succeeded|Failed|Canceled) return 0 ;; esac
                echo "The cluster is $state; waiting"
              else
                echo "Could not read the cluster's state, retrying: $state"
              fi
              sleep 10
            done
            echo "The cluster is still busy or unreadable at the deadline (${state:-no state read})"
            return 1
          }
          EOF

      # The API server admits only authorised ranges. This runner's address is added for the run and removed by the
      # last step, whatever happens in between (the job's concurrency group keeps two runs from editing the list)
      - name: Allow this runner to reach the API server
        id: allow
        if: steps.azure.outputs.configured == 'true'
        timeout-minutes: 15
        run: |
          # shellcheck source=/dev/null
          . "$RUNNER_TEMP/aks-helpers.sh"
          # One deadline for every wait and attempt below, inside the step's 15 minutes
          deadline=$(( $(date +%s) + 14 * 60 ))
          ip="$(curl -fsS --max-time 10 https://api.ipify.org)"
          [[ "$ip" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Could not read this runner's address"; exit 1; }
          echo "ip=$ip" >> "$GITHUB_OUTPUT"
          for attempt in 1 2 3 4 5; do
            wait_idle "$deadline" || { echo "::error::The cluster is still busy after 14 minutes"; exit 1; }
            # The list as it is now; read first, so a failed az stops the step (it never reads as an empty list)
            current="$(az aks show -g "$AKS_RESOURCE_GROUP" -n "$AKS_NAME" --query "apiServerAccessProfile.authorizedIpRanges[]" -o tsv)"
            mapfile -t ranges < <(printf '%s\n' "$current" | grep -v '^$')
            if [ "${#ranges[@]}" -eq 0 ]; then
              echo "::error::$AKS_NAME has no authorised IP ranges: its API server should never be open to all"
              exit 1
            fi
            if printf '%s\n' "${ranges[@]}" | grep -qx "$ip/32"; then
              echo "$ip/32 is authorised"
              break
            fi
            # Set before the update: a run cancelled during it still removes the address
            echo "added=true" >> "$GITHUB_OUTPUT"
            if out="$(az aks update -g "$AKS_RESOURCE_GROUP" -n "$AKS_NAME" \
                --api-server-authorized-ip-ranges "$(IFS=,; echo "${ranges[*]},$ip/32")" --output none 2>&1)"; then
              echo "$ip/32 added"
              break
            fi
            echo "$out"
            # Another operation started meanwhile: wait for it and try again; anything else is an error
            if ! grep -qE 'OperationNotAllowed|Conflict|AnotherOperationInProgress' <<< "$out" || [ "$attempt" -eq 5 ]; then
              exit 1
            fi
          done
          wait_idle "$deadline" || { echo "::error::The cluster is still busy after 14 minutes"; exit 1; }
          # The change takes a little while to reach the API server's firewall
          for attempt in $(seq 30); do
            kubectl get --raw /readyz >/dev/null 2>&1 && exit 0
            echo "API server not reachable yet ($attempt)"
            sleep 10
          done
          echo "::error::The API server is still unreachable from $ip"
          exit 1

      # Deploys follow the order builds finish, which is not always commit order: an older build finishing last must not
      # roll the environment back. The release's image.tag says what runs; a tag older than it (its ancestor) is skipped,
      # unless a manual run asked for the rollback. The same tag redeploys; one that is not on this history deploys
      - name: Check that the deploy goes forward
        id: forward
        if: steps.azure.outputs.configured == 'true'
        run: |
          if ! values="$(helm get values qeos --namespace "$NAMESPACE" --output json 2>&1)"; then
            if grep -q 'release: not found' <<< "$values"; then
              echo "No release yet: the first install"
              echo "deploy=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Could not read the release's values: $values"
            exit 1
          fi
          deployed="$(jq -r '.image.tag // empty' <<< "$values")"
          if [[ "$deployed" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            deployed_ref="platform-v$deployed"
          else
            deployed_ref="$deployed"
          fi
          if [ -z "$deployed" ] || ! git rev-parse --verify --quiet "$deployed_ref^{commit}" >/dev/null; then
            echo "::warning::The release runs '$deployed', which is not a commit of this repository: deploying $TAG"
          elif [ "$(git rev-parse "$deployed_ref^{commit}")" != "$(git rev-parse "$REF^{commit}")" ] \
              && git merge-base --is-ancestor "$REF^{commit}" "$deployed_ref^{commit}"; then
            if [ "$ALLOW_ROLLBACK" != true ]; then
              echo "::notice::Not deployed: $TAG is older than $deployed, which $ENVIRONMENT runs (a later build finished first). Run the workflow by hand with allow_rollback to go back"
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::Rolling $ENVIRONMENT back from $deployed to $TAG (allow_rollback)"
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Deploy the chart
        if: steps.azure.outputs.configured == 'true' && steps.forward.outputs.deploy == 'true'
        # helm's own 20 minutes, and its rollback
        timeout-minutes: 25
        run: |
          # Each id is a GUID: the configuration check validated the object
          id_services="$(jq -er '.services' <<< "$WORKLOAD_IDENTITY_CLIENT_IDS")"
          id_ingestion="$(jq -er '.ingestion' <<< "$WORKLOAD_IDENTITY_CLIENT_IDS")"
          id_retention="$(jq -er '.["ingestion-retention"]' <<< "$WORKLOAD_IDENTITY_CLIENT_IDS")"
          id_migrate="$(jq -er '.migrate' <<< "$WORKLOAD_IDENTITY_CLIENT_IDS")"
          # --timeout above migrate.activeDeadlineSeconds (900 s), so the Job, not Helm, decides a slow migration
          helm upgrade --install qeos "$CHART" --namespace "$NAMESPACE" \
            -f "$CHART/values-$ENVIRONMENT.yaml" \
            --set image.registry="$ACR_NAME.azurecr.io" \
            --set image.tag="$TAG" \
            --set publicUrl="https://$PUBLIC_HOSTNAME" \
            --set keyvault.name="$KEY_VAULT_NAME" \
            --set keyvault.tenantId="$AZURE_TENANT_ID" \
            --set keyvault.clientIds.services="$id_services" \
            --set keyvault.clientIds.ingestion="$id_ingestion" \
            --set keyvault.clientIds.ingestion-retention="$id_retention" \
            --set keyvault.clientIds.migrate="$id_migrate" \
            --set postgres.host="$POSTGRES_HOST" \
            --set artifacts.azure.accountUrl="$STORAGE_ACCOUNT_URL" \
            --set artifacts.azure.container="$ARTIFACTS_CONTAINER" \
            --set smtp.fromEmail="$EMAIL_SENDER" \
            --set edge.publicIp.name="pip-${AKS_NAME}-edge" \
            --set edge.publicIp.resourceGroup="$AKS_RESOURCE_GROUP" \
            --set edge.acme.email="$ACME_EMAIL" \
            --atomic --wait --timeout 20m

      # The release is in place by now; these say whether users can reach it. The first certificate takes a few minutes
      - name: Check the edge
        if: steps.azure.outputs.configured == 'true' && steps.forward.outputs.deploy == 'true'
        timeout-minutes: 20
        run: |
          kubectl -n "$NAMESPACE" wait --for=condition=Programmed gateway/qeos-edge --timeout 5m
          kubectl -n "$NAMESPACE" wait --for=condition=Ready certificate/qeos-edge --timeout 10m
          for attempt in $(seq 30); do
            curl -fsS --max-time 10 -o /dev/null "https://$PUBLIC_HOSTNAME/health" && { echo "https://$PUBLIC_HOSTNAME/health answers"; exit 0; }
            echo "Not reachable yet ($attempt)"
            sleep 10
          done
          echo "::error::The release is deployed, but https://$PUBLIC_HOSTNAME/health does not answer"
          exit 1

      # A fresh sign-in: the first one's tokens may have expired during a long deploy
      - name: Sign in to Azure again
        if: always() && steps.allow.outputs.added == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ env.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      # Removes only this runner's address. It first waits for any operation still running on the cluster (the add of a
      # run cancelled mid-update goes on in Azure, and an upgrade may be running), then reads the list as it is NOW, so
      # the address is never written back by a stale list and a change made meanwhile (a Bicep deploy) stays; it retries
      # when another operation starts first. It never sets an empty list: that would open the API server to all. All its
      # waits and attempts share one deadline, 25 minutes and never past the job's own end, so it always ends by itself
      # and says when the address is left behind (deploy/azure/README.md, section 5.1: removing it by hand)
      - name: Remove this runner from the API server's ranges
        if: always() && steps.allow.outputs.added == 'true'
        env:
          RUNNER_IP: ${{ steps.allow.outputs.ip }}
        run: |
          leftover="$RUNNER_IP/32 may still be authorised on $AKS_NAME: remove it by hand (deploy/azure/README.md, section 5.1)"
          # Every way this step fails says so, whatever stopped it
          trap 'status=$?; [ "$status" = 0 ] || echo "::error::$leftover"' EXIT
          # shellcheck source=/dev/null
          . "$RUNNER_TEMP/aks-helpers.sh"
          now=$(date +%s)
          deadline=$(( now + 25 * 60 ))
          job_end=$(( ${JOB_STARTED:-$now} + (JOB_TIMEOUT_MINUTES - 2) * 60 ))
          [ "$deadline" -le "$job_end" ] || deadline=$job_end
          echo "Removing $RUNNER_IP/32 until $(date -u -d "@$deadline" +%H:%M:%SZ)"
          while wait_idle "$deadline"; do
            # A failed read is retried within the deadline; it is never taken for an empty list
            if ! current="$(az aks show -g "$AKS_RESOURCE_GROUP" -n "$AKS_NAME" --query "apiServerAccessProfile.authorizedIpRanges[]" -o tsv 2>&1)"; then
              echo "Could not read the authorised ranges, retrying: $current"
              sleep 10
              continue
            fi
            if ! grep -qx "$RUNNER_IP/32" <<< "$current"; then
              echo "$RUNNER_IP/32 is not authorised"
              exit 0
            fi
            mapfile -t ranges < <(printf '%s\n' "$current" | grep -v -x -e "$RUNNER_IP/32" -e '')
            if [ "${#ranges[@]}" -eq 0 ]; then
              echo "::error::$RUNNER_IP/32 is the only authorised range left; not removed, as an empty list opens the API server (set the operators' ranges with az aks update --api-server-authorized-ip-ranges)"
              exit 1
            fi
            if out="$(az aks update -g "$AKS_RESOURCE_GROUP" -n "$AKS_NAME" \
                --api-server-authorized-ip-ranges "$(IFS=,; echo "${ranges[*]}")" --output none 2>&1)"; then
              echo "$RUNNER_IP/32 removed"
              exit 0
            fi
            echo "$out"
            # Another operation started first: wait for it and try again; anything else is an error
            grep -qE 'OperationNotAllowed|Conflict|AnotherOperationInProgress' <<< "$out" || exit 1
          done
          echo "Out of time"
          exit 1

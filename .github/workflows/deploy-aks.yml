name: Deploy to AKS

# Deploys the Helm chart (deploy/helm/qeos) to an AKS environment (ADR-038, spec 5.8). Staging: automatically after
# "Build platform images" pushed master's images, or by hand. Production: a later stage (its values file does not exist
# yet), so choosing it fails at once. deploy/helm/README.md, "The deploy workflow", lists the variables it reads.
on:
  workflow_run:
    workflows: [ "Build platform images" ]
    types: [ completed ]
    branches: [ master ]
  workflow_dispatch:
    inputs:
      environment:
        description: The AKS environment
        type: choice
        options: [ staging, production ]
        default: staging
      tag:
        description: The images' tag, a full git SHA from master or a platform version (1.2.3)
        type: string
        required: true

permissions:
  contents: read

# One deploy per environment at a time: each run adds its runner's address to the API server's authorised ranges and
# removes it afterwards, and two runs editing that list at once would undo each other's change
concurrency:
  group: deploy-aks-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  target:
    name: Choose what to deploy
    # workflow_run fires for every "Build platform images" run of a branch named master. Only a green run in this
    # repository deploys; that workflow itself runs on CI's workflow_run, so its event is workflow_run, never push
    # (a platform-v* tag run is a push, and its branch is the tag, which the branches filter above leaves out)
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'workflow_run' &&
        github.event.workflow_run.head_branch == 'master' &&
        github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      tag: ${{ steps.target.outputs.tag }}
      ref: ${{ steps.target.outputs.ref }}
    steps:
      - name: Check the environment and the tag
        id: target
        env:
          ENVIRONMENT: ${{ inputs.environment || 'staging' }}
          # The commit the built images are tagged with (workflow_run) or the one asked for
          TAG: ${{ inputs.tag || github.event.workflow_run.head_sha }}
        run: |
          if [ "$ENVIRONMENT" != staging ]; then
            echo "::error::Only staging can be deployed now: production (values-production.yaml, the production cluster and its approval) is a later stage (spec 5.11)"
            exit 1
          fi
          # Images are tagged with the full SHA (master) and, for platform-v* tags, with the version too (build-platform.yml)
          if [[ "$TAG" =~ ^[0-9a-f]{40}$ ]]; then
            ref="$TAG"
          elif [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            ref="platform-v$TAG"
          else
            echo "::error::tag must be a full git SHA (40 hex characters) or a platform version like 1.2.3, got '$TAG'"
            exit 1
          fi
          {
            echo "environment=$ENVIRONMENT"
            echo "tag=$TAG"
            echo "ref=$ref"
          } >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy (${{ needs.target.outputs.environment }})
    needs: target
    runs-on: ubuntu-latest
    # helm's 20 minutes, the API server range changes (a few minutes each) and the checks after
    timeout-minutes: 45
    # Its variables (below) and, for production later, its required reviewers; the Azure identity's federated
    # credential trusts repo:<org>/<repo>:environment:<name>
    environment: ${{ needs.target.outputs.environment }}
    permissions:
      contents: read
      # The OIDC token azure/login exchanges for an Azure access token (no stored secret)
      id-token: write
    env:
      ENVIRONMENT: ${{ needs.target.outputs.environment }}
      TAG: ${{ needs.target.outputs.tag }}
      NAMESPACE: qeos
      CHART: deploy/helm/qeos
      # Repository variables (build-platform.yml uses them too)
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      # The GitHub environment's variables: Bicep's outputs (deploy/azure/README.md, section 5) and the ACME contact
      AKS_NAME: ${{ vars.AKS_NAME }}
      AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
      KEY_VAULT_NAME: ${{ vars.KEY_VAULT_NAME }}
      POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
      STORAGE_ACCOUNT_URL: ${{ vars.STORAGE_ACCOUNT_URL }}
      ARTIFACTS_CONTAINER: ${{ vars.ARTIFACTS_CONTAINER }}
      WORKLOAD_IDENTITY_CLIENT_IDS: ${{ vars.WORKLOAD_IDENTITY_CLIENT_IDS }}
      EMAIL_SENDER: ${{ vars.EMAIL_SENDER }}
      PUBLIC_HOSTNAME: ${{ vars.PUBLIC_HOSTNAME }}
      ACME_EMAIL: ${{ vars.ACME_EMAIL }}
    steps:
      # Safe to merge before Azure exists: the automatic run only prints a notice; a manual one fails
      - name: Check that Azure is configured
        id: azure
        run: |
          missing=()
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID ACR_NAME AKS_NAME AKS_RESOURCE_GROUP \
                      KEY_VAULT_NAME POSTGRES_HOST STORAGE_ACCOUNT_URL ARTIFACTS_CONTAINER WORKLOAD_IDENTITY_CLIENT_IDS \
                      EMAIL_SENDER PUBLIC_HOSTNAME ACME_EMAIL; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            echo "::notice::Skipping the deploy: variable(s) ${missing[*]} not set for $ENVIRONMENT (Azure is not configured yet)"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Variable(s) ${missing[*]} not set (repository, or the GitHub environment $ENVIRONMENT)"
            exit 1
          fi

      # The chart of the commit the images were built from
      - uses: actions/checkout@v7
        if: steps.azure.outputs.configured == 'true'
        with:
          ref: ${{ needs.target.outputs.ref }}

      - uses: azure/setup-helm@v4
        if: steps.azure.outputs.configured == 'true'
        with:
          version: v3.16.4

      - name: Sign in to Azure
        if: steps.azure.outputs.configured == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      # Local accounts are off: kubectl and helm sign in with Entra ID through kubelogin, using the az session above
      - name: Install kubectl and kubelogin
        if: steps.azure.outputs.configured == 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          az aks install-cli --client-version 1.36.4 \
            --install-location "$HOME/.local/bin/kubectl" --kubelogin-install-location "$HOME/.local/bin/kubelogin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # A tag that was never pushed (the build skipped, failed, or master moved on before it pushed) stops here, not
      # after 20 minutes of ImagePullBackOff and a rollback
      - name: Check that every image exists
        if: steps.azure.outputs.configured == 'true'
        run: |
          missing=()
          for name in auth-service organization-service project-service ingestion-service test-management-service \
                      dashboard gateway; do
            az acr repository show --name "$ACR_NAME" --image "qeos/$name:$TAG" --output none 2>/dev/null \
              || missing+=("qeos/$name:$TAG")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Not in $ACR_NAME: ${missing[*]}"
            exit 1
          fi

      - name: Check that the cluster is running
        if: steps.azure.outputs.configured == 'true'
        run: |
          state="$(az aks show -g "$AKS_RESOURCE_GROUP" -n "$AKS_NAME" --query powerState.code -o tsv)"
          if [ "$state" != Running ]; then
            echo "::error::$AKS_NAME is $state: start it first (deploy/azure/README.md, section 6)"
            exit 1
          fi

      - name: Get the cluster's credentials
        if: steps.azure.outputs.configured == 'true'
        run: |
          kubeconfig="$RUNNER_TEMP/kubeconfig"
          az aks get-credentials -g "$AKS_RESOURCE_GROUP" -n "$AKS_NAME" --file "$kubeconfig" --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli --kubeconfig "$kubeconfig"
          echo "KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"

      # The API server admits only authorised ranges. This runner's address is added for the run and removed by the
      # last step, whatever happens in between (the concurrency group keeps two runs from editing the list together)
      - name: Allow this runner to reach the API server
        id: allow
        if: steps.azure.outputs.configured == 'true'
        run: |
          ip="$(curl -fsS --max-time 10 https://api.ipify.org)"
          [[ "$ip" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Could not read this runner's address"; exit 1; }
          echo "ip=$ip" >> "$GITHUB_OUTPUT"
          # Read first, so a failed az stops the step (a failure inside < <(...) would read as an empty list)
          current="$(az aks show -g "$AKS_RESOURCE_GROUP" -n "$AKS_NAME" --query "apiServerAccessProfile.authorizedIpRanges[]" -o tsv)"
          mapfile -t ranges < <(printf '%s\n' "$current" | grep -v '^$')
          if [ "${#ranges[@]}" -eq 0 ]; then
            echo "::error::$AKS_NAME has no authorised IP ranges: its API server should never be open to all"
            exit 1
          fi
          if printf '%s\n' "${ranges[@]}" | grep -qx "$ip/32"; then
            echo "$ip/32 is already authorised: left as it is"
          else
            echo "added=true" >> "$GITHUB_OUTPUT"
            az aks update -g "$AKS_RESOURCE_GROUP" -n "$AKS_NAME" \
              --api-server-authorized-ip-ranges "$(IFS=,; echo "${ranges[*]},$ip/32")" --output none
          fi
          # The change takes a little while to reach the API server's firewall
          for attempt in $(seq 30); do
            kubectl get --raw /readyz >/dev/null 2>&1 && exit 0
            echo "API server not reachable yet ($attempt)"
            sleep 10
          done
          echo "::error::The API server is still unreachable from $ip"
          exit 1

      - name: Deploy the chart
        if: steps.azure.outputs.configured == 'true'
        run: |
          ids() { jq -er --arg key "$1" '.[$key]' <<< "$WORKLOAD_IDENTITY_CLIENT_IDS"; }
          # --timeout above migrate.activeDeadlineSeconds (900 s), so the Job, not Helm, decides a slow migration
          helm upgrade --install qeos "$CHART" --namespace "$NAMESPACE" \
            -f "$CHART/values-$ENVIRONMENT.yaml" \
            --set image.registry="$ACR_NAME.azurecr.io" \
            --set image.tag="$TAG" \
            --set publicUrl="https://$PUBLIC_HOSTNAME" \
            --set keyvault.name="$KEY_VAULT_NAME" \
            --set keyvault.tenantId="$AZURE_TENANT_ID" \
            --set keyvault.clientIds.services="$(ids services)" \
            --set keyvault.clientIds.ingestion="$(ids ingestion)" \
            --set keyvault.clientIds.ingestion-retention="$(ids ingestion-retention)" \
            --set keyvault.clientIds.migrate="$(ids migrate)" \
            --set postgres.host="$POSTGRES_HOST" \
            --set artifacts.azure.accountUrl="$STORAGE_ACCOUNT_URL" \
            --set artifacts.azure.container="$ARTIFACTS_CONTAINER" \
            --set smtp.fromEmail="$EMAIL_SENDER" \
            --set edge.publicIp.name="pip-${AKS_NAME}-edge" \
            --set edge.publicIp.resourceGroup="$AKS_RESOURCE_GROUP" \
            --set edge.acme.email="$ACME_EMAIL" \
            --atomic --wait --timeout 20m

      # The release is in place by now; these say whether users can reach it. The first certificate takes a few minutes
      - name: Check the edge
        if: steps.azure.outputs.configured == 'true'
        run: |
          kubectl -n "$NAMESPACE" wait --for=condition=Programmed gateway/qeos-edge --timeout 5m
          kubectl -n "$NAMESPACE" wait --for=condition=Ready certificate/qeos-edge --timeout 10m
          for attempt in $(seq 30); do
            curl -fsS --max-time 10 -o /dev/null "https://$PUBLIC_HOSTNAME/health" && { echo "https://$PUBLIC_HOSTNAME/health answers"; exit 0; }
            echo "Not reachable yet ($attempt)"
            sleep 10
          done
          echo "::error::The release is deployed, but https://$PUBLIC_HOSTNAME/health does not answer"
          exit 1

      # A fresh sign-in: the first one's tokens may have expired during a long deploy
      - name: Sign in to Azure again
        if: always() && steps.allow.outputs.added == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      # Removes only this runner's address, from the list as it is now, so a change made meanwhile (a Bicep deploy)
      # stays. It never sets an empty list: that would open the API server to every address
      - name: Remove this runner from the API server's ranges
        if: always() && steps.allow.outputs.added == 'true'
        env:
          RUNNER_IP: ${{ steps.allow.outputs.ip }}
        run: |
          current="$(az aks show -g "$AKS_RESOURCE_GROUP" -n "$AKS_NAME" --query "apiServerAccessProfile.authorizedIpRanges[]" -o tsv)"
          mapfile -t ranges < <(printf '%s\n' "$current" | grep -v -x -e "$RUNNER_IP/32" -e '')
          if [ "${#ranges[@]}" -eq 0 ]; then
            echo "::error::$RUNNER_IP/32 is the only authorised range left; not removed, as an empty list opens the API server. Remove it by hand (az aks update --api-server-authorized-ip-ranges <operators' ranges>)"
            exit 1
          fi
          az aks update -g "$AKS_RESOURCE_GROUP" -n "$AKS_NAME" \
            --api-server-authorized-ip-ranges "$(IFS=,; echo "${ranges[*]}")" --output none
          echo "$RUNNER_IP/32 removed"

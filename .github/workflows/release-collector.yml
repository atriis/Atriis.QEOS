name: Release collector

# Tag collector-vX.Y.Z to release. Publishing to PyPI uses trusted publishing
# (OIDC, no token): configure the publisher once on pypi.org for project
# qeos-collector (owner atriis, repo Atriis.QEOS, this workflow,
# environment pypi), then set the repository variable PYPI_PUBLISH=true.
# Until that variable exists the publish job is skipped and a tag only
# builds + verifies the artifacts.

on:
  push:
    # Full versions only, so moving the floating major tag (collector-v0) never starts a release
    tags: ["collector-v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
        include:
          # ubuntu-latest is 26.04, which has no Python 3.9; drop this pin when 3.9 support is dropped
          - python: "3.9"
            os: ubuntu-24.04
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . pytest
      - run: python -m pytest tests/ -q

  build:
    name: Build and verify
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tag must match the package version
        run: |
          version="$(python -c 'import sys; sys.path.insert(0, "src"); from qeos_collector import __version__; print(__version__)')"
          tag="${GITHUB_REF_NAME#collector-v}"
          test "$version" = "$tag" || { echo "tag $tag != __version__ $version"; exit 1; }
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Single-file build (zipapp)
        run: |
          python scripts/build_zipapp.py --out dist/qeos-collector.pyz
          python dist/qeos-collector.pyz --version
      - uses: actions/upload-artifact@v7
        with:
          name: collector-dist
          path: collector/dist/

  release:
    name: GitHub Release with the artifacts
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: collector-dist
          path: dist/
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                 --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  docker:
    name: Docker image to GHCR
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      # contents: read too: a job's permissions replace the workflow's, and checkout of a private repository needs it
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build, verify, push
        run: |
          version="${GITHUB_REF_NAME#collector-v}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/qeos-collector"
          docker build collector -t "$image:$version" -t "$image:latest"
          docker run --rm "$image:$version" --version
          docker push "$image:$version"
          docker push "$image:latest"

  float:
    name: Move the floating major tag
    needs: [test, build]
    # Workflows using collector-action@collector-v0 follow this tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Point collector-vN at this release
        run: |
          version="${GITHUB_REF_NAME#collector-v}"
          # Stable versions only: a pre-release (0.6.0-rc1) leaves the tag where it is. Checked on
          # the version, not the tag name, which always contains a "-" (collector-v...)
          case "$version" in
            *-*) echo "pre-release $version: collector-v${version%%.*} not moved"; exit 0 ;;
          esac
          major="collector-v${version%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"

  publish:
    name: Publish to PyPI (trusted publishing)
    needs: build
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: collector-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

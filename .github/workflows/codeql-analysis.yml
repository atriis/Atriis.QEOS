name: "CodeQL"

on:
  push:
    branches: [ main, master ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ main, master ]
  schedule:
    - cron: '0 12 * * 1'  # Every Monday at 12:00 UTC

jobs:
  analyze:
    name: Analyze
    # A private organization repository needs GitHub Code Security for code scanning; without it the
    # upload fails on every push. Set the repository variable CODEQL_ENABLED=true once it is enabled.
    if: vars.CODEQL_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      # required for all workflows
      actions: read
      contents: read
      security-events: write

      # only required for requests to public repositories by public GitHub-hosted runners:
      # ID token: write
      # attestations: write
      # only required to be able to request a CVE number for scanned repositories:
      # issues: write
      # attachments: write
      # checks: write
      # deployments: write
      # discussions: write
      # environments: write
      # issues: write
      # pages: write
      # pulls: write
      # repository-projects: write
      # security-events: write
      # statuses: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]
        # Learn more about CodeQL language support: https://aka.ms/codeql-docs/language-support

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.
        # queries: ./path/to/local/query, your-org/your-repo/queries@main

    - name: Autobuild
      uses: github/codeql-action/autobuild@v4

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"

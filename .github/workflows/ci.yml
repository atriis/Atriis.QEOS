name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# A newer push to the same branch or PR makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      # One service failing must not hide the other's result.
      fail-fast: false
      matrix:
        include:
          # Adding a service is one more entry here. `extra_tests` runs additional suites
          # from the same environment: the shared package has no venv of its own, and a
          # service's requirements already install it plus pytest and psycopg 3 (psycopg[binary]).
          - service: organization-service
            path: platforms/organization-service
            extra_tests: ../../shared/tests
          - service: auth-service
            path: platforms/auth-service/auth-service
            extra_tests: ""
          - service: project-service
            path: platforms/project-service
            extra_tests: ""
          - service: ingestion-service
            path: platforms/ingestion-service
            extra_tests: ""
          - service: test-management-service
            path: platforms/test-management-service
            extra_tests: ""
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    env:
      # The services refuse to start without one; any value works for the test suites.
      SECRET_KEY: ci-test-secret
    steps:
      - uses: actions/checkout@v7
        with:
          # The parent commit lets the collector record which files the push changed
          fetch-depth: 2

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.path }}/requirements.txt

      # requirements.txt installs ../shared editable via a relative path, which is why
      # this runs from the service directory.
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run service tests
        run: python -m pytest tests/ -q --junitxml=reports/junit-service.xml

      - name: Run extra suites
        if: matrix.extra_tests != ''
        run: python -m pytest ${{ matrix.extra_tests }} -q --junitxml=reports/junit-extra.xml

      # Dogfooding: the repository reports its own test results to a QEOS
      # deployment. Runs only when the QEOS_URL (or pre-rename QAV_URL) repository variable is set, and never
      # on fork PRs (no secrets there). Reporting can never turn the build red.
      - name: Report results to QEOS
        if: always() && (vars.QEOS_URL || vars.QAV_URL) != '' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        env:
          QEOS_URL: ${{ vars.QEOS_URL || vars.QAV_URL }}
          QEOS_API_KEY: ${{ secrets.QEOS_API_KEY || secrets.QAV_API_KEY }}
        run: |
          python -m pip install --quiet "${{ github.workspace }}/collector"
          qeos-collector upload "reports/*.xml" --environment ${{ matrix.service }}

  # The screenshot paths SQLite cannot test (ADR-036): the FOR KEY SHARE lock and the link savepoint. The test file
  # is skipped without QEOS_TEST_POSTGRES_URL, and drops and creates the ingestion tables, so it gets its own
  # throwaway database here.
  ingestion-postgres:
    name: Tests (ingestion-service on PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-postgres
          POSTGRES_DB: qeos_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d qeos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: platforms/ingestion-service
    env:
      SECRET_KEY: ci-test-secret
      # The test file refuses any URL that is not localhost with "test" or "scratch" in the database name
      QEOS_TEST_POSTGRES_URL: postgresql+psycopg://postgres:ci-postgres@localhost:55432/qeos_test
    steps:
      - uses: actions/checkout@v7
        with:
          # The parent commit lets the collector record which files the push changed
          fetch-depth: 2

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: platforms/ingestion-service/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # A skipped test does not fail pytest, and this job exists only to run these tests: the summary line must be
      # "N passed" with nothing skipped, so a lost QEOS_TEST_POSTGRES_URL turns the job red instead of green.
      - name: Run the PostgreSQL-only tests
        run: |
          # The default shell has no pipefail: without it, tee's exit code would hide a pytest failure
          set -o pipefail
          python -m pytest tests/integration/test_screenshots_postgres.py -q -rs --junitxml=reports/junit-postgres.xml | tee "$RUNNER_TEMP/pytest-postgres.log"
          if ! tail -n 1 "$RUNNER_TEMP/pytest-postgres.log" | grep -Eq '^[0-9]+ passed(, [0-9]+ warnings?)? in '; then
            echo "::error::the PostgreSQL-only tests did not all run and pass (skipped, or no tests collected)"
            exit 1
          fi

      # Dogfooding, as in the tests job. Reporting can never turn the build red.
      - name: Report results to QEOS
        if: always() && (vars.QEOS_URL || vars.QAV_URL) != '' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        env:
          QEOS_URL: ${{ vars.QEOS_URL || vars.QAV_URL }}
          QEOS_API_KEY: ${{ secrets.QEOS_API_KEY || secrets.QAV_API_KEY }}
        run: |
          python -m pip install --quiet "${{ github.workspace }}/collector"
          qeos-collector upload "reports/*.xml" --environment ingestion-service-postgres

  smoke:
    name: Container smoke test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: organization-service
            path: platforms/organization-service
            port: 8001
          - service: auth-service
            path: platforms/auth-service/auth-service
            port: 8000
          - service: project-service
            path: platforms/project-service
            port: 8002
          - service: ingestion-service
            path: platforms/ingestion-service
            port: 8003
          - service: test-management-service
            path: platforms/test-management-service
            port: 8004
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    env:
      # docker-compose.yml requires SECRET_KEY (`${SECRET_KEY:?...}`) and has no fallback.
      SECRET_KEY: ci-smoke-secret
    steps:
      - uses: actions/checkout@v7

      # --wait blocks until every service's healthcheck passes, and fails if any container
      # exits or never becomes healthy. That is what catches a broken image or entry point:
      # the unit tests import the app directly and never start the container.
      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 180

      - name: Check /health from the host
        run: curl --fail --silent --show-error http://localhost:${{ matrix.port }}/health

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down --volumes

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
        with:
          # The parent commit lets the collector record which files the push changed
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test -- --reporter=default --reporter=junit --outputFile.junit=reports/junit.xml

      - name: Workflow template tests (templates/github)
        run: node --test ../templates/github/qeos-run.test.mjs

      - name: Build
        run: npm run build

      - uses: actions/setup-python@v7
        if: always() && (vars.QEOS_URL || vars.QAV_URL) != '' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          python-version: "3.12"

      # Dogfooding: the repository reports its own test results to a QEOS
      # deployment. Runs only when the QEOS_URL (or pre-rename QAV_URL) repository variable is set, and never
      # on fork PRs (no secrets there). Reporting can never turn the build red.
      - name: Report results to QEOS
        if: always() && (vars.QEOS_URL || vars.QAV_URL) != '' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        env:
          QEOS_URL: ${{ vars.QEOS_URL || vars.QAV_URL }}
          QEOS_API_KEY: ${{ secrets.QEOS_API_KEY || secrets.QAV_API_KEY }}
        run: |
          python -m pip install --quiet "${{ github.workspace }}/collector"
          qeos-collector upload "reports/*.xml" --environment dashboard

  collector:
    name: Collector (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported version and a current one
        python: ["3.9", "3.12"]
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v7
        with:
          # The parent commit lets the collector record which files the push changed
          fetch-depth: 2

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # A regular (not editable) install, so the tests run against the package as customers get it
      - name: Install the collector and pytest
        # cryptography only for the mTLS test, which generates a real client certificate
        run: python -m pip install . pytest cryptography

      - name: The entry point works
        run: qeos-collector --version

      - name: Run tests
        run: python -m pytest -q --junitxml=reports/junit.xml

      # Dogfooding: the repository reports its own test results to a QEOS
      # deployment. Runs only when the QEOS_URL (or pre-rename QAV_URL) repository variable is set, and never
      # on fork PRs (no secrets there). Reporting can never turn the build red.
      - name: Report results to QEOS
        if: always() && (vars.QEOS_URL || vars.QAV_URL) != '' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        env:
          QEOS_URL: ${{ vars.QEOS_URL || vars.QAV_URL }}
          QEOS_API_KEY: ${{ secrets.QEOS_API_KEY || secrets.QAV_API_KEY }}
        run: |
          qeos-collector upload "reports/*.xml" --environment collector-py${{ matrix.python }}

  collector-action:
    name: collector-action installs and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # impact first scores the change: the pull request's base, or the commit's parent

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The composite action as consumers use it; --dry-run parses and prints without uploading,
      # so a broken install step fails here instead of in someone's CI
      - name: Run the action
        uses: ./collector-action
        with:
          url: https://qeos.example.invalid
          patterns: collector/tests/fixtures/pytest.xml
          extra-args: --dry-run

      # impact: first, as consumers use it: a stand-in QEOS suggests "Finds a product", a stand-in Cucumber runs it in
      # stage 1 and "Opens the shop" in stage 2 (the quoted --tags keeps "Not tagged" out), and one run is uploaded
      - name: Start a stand-in QEOS
        run: |
          nohup python collector/tests/fake_qeos.py 18080 collector/tests/fixtures/fake-qeos-suggestion.json \
            "$RUNNER_TEMP/qeos-uploads.jsonl" > "$RUNNER_TEMP/fake-qeos.log" 2>&1 &
          for _ in $(seq 50); do
            python -c "import socket; socket.create_connection(('127.0.0.1', 18080), 1)" 2>/dev/null && exit 0
            sleep 0.2
          done
          echo "::error::the stand-in QEOS did not start"; cat "$RUNNER_TEMP/fake-qeos.log"; exit 1

      - name: Run the action with impact first
        uses: ./collector-action
        env:
          QEOS_API_KEY: qeos_ci_placeholder_key
          FAKE_CUCUMBER_SPEC: collector/tests/fixtures/fake-cucumber-green.json
          FAKE_CUCUMBER_LOG: ${{ runner.temp }}/fake-cucumber.log
        with:
          url: http://127.0.0.1:18080
          impact: first
          test-command: python collector/tests/fake_cucumber.py --tags "@smoke"
          extra-args: --cucumber js --fail-on-error

      - name: The two stages ran and were uploaded as one run
        run: |
          python - <<'PY'
          import json, os
          temp = os.environ["RUNNER_TEMP"]
          calls = [json.loads(line) for line in open(f"{temp}/fake-cucumber.log", encoding="utf-8")]
          real = [call["ran"] for call in calls if not call["dry_run"]]
          assert real == [["features/smoke.feature:6"], ["features/smoke.feature:3"]], real
          assert all(call["argv"][:2] == ["--tags", "@smoke"] for call in calls), calls
          [body] = [json.loads(line) for line in open(f"{temp}/qeos-uploads.jsonl", encoding="utf-8")]
          assert body["run"]["scope"] == "full", body["run"]
          assert [s["name"] for s in body["run"]["stages"]["stages"]] == ["suggested", "rest"], body["run"]
          assert sorted(r["name"] for r in body["results"]) == ["Finds a product", "Opens the shop"]
          print("impact first: 2 stages, 1 upload")
          PY

      # command: import-features, as private consumers use it from a private Atriis.QEOS (pip from git+https has no
      # credentials on a runner; the action installs from its own checkout). --branch names this branch, so the
      # sync is not skipped on a pull request; --dry-run asks the stand-in for the plan
      - name: Run the action with command import-features
        uses: ./collector-action
        env:
          QEOS_API_KEY: qeos_ci_placeholder_key
        with:
          url: http://127.0.0.1:18080
          command: import-features
          patterns: collector/tests/fixtures/sync/*.feature
          extra-args: --dry-run --branch ${{ github.head_ref || github.ref_name }}

      - name: The .feature file was sent to the import
        run: |
          python - <<'PY'
          import json, os
          temp = os.environ["RUNNER_TEMP"]
          lines = [json.loads(line) for line in open(f"{temp}/qeos-uploads.jsonl", encoding="utf-8")]
          body = lines[-1]
          assert body["full"] is True, body
          assert [f["path"] for f in body["files"]] == ["collector/tests/fixtures/sync/shop.feature"], body["files"]
          assert "Opens the shop" in body["files"][0]["content"], body["files"][0]
          print("import-features: 1 file sent")
          PY

      - name: Logs of the impact first check
        if: failure()
        run: |
          for log in fake-cucumber.log qeos-uploads.jsonl fake-qeos.log; do
            echo "::group::$log"
            cat "$RUNNER_TEMP/$log" 2>/dev/null || echo "(no $log)"
            echo "::endgroup::"
          done

      - name: The installed collector is this commit's version
        run: |
          expected=$(python -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('collector/src/qeos_collector/__init__.py').read_text()).group(1))")
          test "$(qeos-collector --version | awk '{print $NF}')" = "$expected"

  monitoring:
    name: Monitoring configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # promtool check/test rules and check config, amtool on rendered Alertmanager files, the Alertmanager render test
      - name: Static checks
        run: bash monitoring/check.sh

  architecture-docs:
    name: Architecture docs match the stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # README's diagram and component table and the blueprint's status banner against the compose files and the gateway
      - name: Check
        run: python scripts/check_architecture_docs.py

      - name: Tests of the check
        run: |
          python -m pip install --quiet pytest
          python -m pytest scripts/tests -q

  gateway:
    name: Gateway and full stack
    runs-on: ubuntu-latest
    env:
      # docker-compose.yml requires SECRET_KEY and has no fallback
      SECRET_KEY: ci-gateway-secret
      # Required by docker-compose.yml as well (project-service's internal API)
      INTERNAL_API_PASSWORD: ci-internal-secret
    steps:
      - uses: actions/checkout@v7

      - name: Check the NGINX configuration
        run: |
          docker build -t qeos/gateway:ci gateway
          docker run --rm qeos/gateway:ci nginx -t
          # The gated /grafana/ location (ADR-027)
          docker run --rm -e MONITORING_ENABLED=true qeos/gateway:ci nginx -t
          # The Kubernetes settings (ADR-038): TLS off behind the edge, the cluster DNS and service names, halved rates,
          # on a read-only root. nginx resolves its resolver at start, so the cluster DNS name points at 127.0.0.1 here
          docker run --rm --read-only --tmpfs /tmp --add-host kube-dns.kube-system.svc.cluster.local:127.0.0.1 \
            -e NGINX_RENDER_DIR=/tmp/nginx -e NGINX_CERT_DIR=/tmp/certs -e MONITORING_ENABLED=true \
            -e GATEWAY_TLS=off -e GATEWAY_RESOLVER=kube-dns.kube-system.svc.cluster.local \
            -e UPSTREAM_SUFFIX=.qeos.svc.cluster.local -e GATEWAY_PUBLIC_PORT=443 -e GATEWAY_TRUSTED_PROXIES=10.224.0.0/16 \
            -e GRAFANA_UPSTREAM=grafana.qeos.svc.cluster.local:3000 -e RATE_API=10r/s -e RATE_AUTH=150r/m \
            -e RATE_COLLECT=5r/s -e RATE_COLLECT_BLOBS=25r/s -e RATE_COLLECT_ARTIFACTS=5r/s \
            qeos/gateway:ci nginx -t

      # Waiting on the gateway waits on everything it depends on: postgres, db-init, the three
      # migrations and the three services. The one-shot jobs are not waited on themselves.
      - name: Start the platform
        run: docker compose up -d --build --wait --wait-timeout 300 gateway

      - name: Smoke-test through the gateway
        run: bash scripts/smoke_gateway.sh

      # The same stack with the monitoring profile: gateway and auth-service are recreated with
      # MONITORING_ENABLED, db-init re-runs and creates qeos_monitor (spec section 8)
      - name: Start the monitoring profile
        env:
          COMPOSE_PROFILES: monitoring
          MONITORING_ENABLED: "true"
          GRAFANA_ADMIN_PASSWORD: ci-grafana-admin
          MONITORING_DB_PASSWORD: ci-monitor
        run: docker compose up -d --build --wait --wait-timeout 300 gateway prometheus alertmanager grafana node-exporter cadvisor postgres-exporter

      - name: Smoke-test with monitoring
        env:
          COMPOSE_PROFILES: monitoring
          MONITORING_ENABLED: "true"
          GRAFANA_ADMIN_PASSWORD: ci-grafana-admin
          MONITORING_DB_PASSWORD: ci-monitor
        run: bash scripts/smoke_gateway.sh

      - name: Show logs on failure
        if: failure()
        env:
          COMPOSE_PROFILES: monitoring
        run: docker compose logs

      - name: Tear down
        if: always()
        env:
          COMPOSE_PROFILES: monitoring
        run: docker compose down --volumes

  # Every platform image as build-platform.yml builds it, scanned by Trivy: a fixable CRITICAL finding fails here, in the
  # pull request, rather than when master's images are pushed (ADR-038). Nothing is pushed
  image-scan:
    name: Trivy (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: auth-service, context: ., dockerfile: platforms/auth-service/auth-service/Dockerfile }
          - { image: organization-service, context: ., dockerfile: platforms/organization-service/Dockerfile }
          - { image: project-service, context: ., dockerfile: platforms/project-service/Dockerfile }
          - { image: ingestion-service, context: ., dockerfile: platforms/ingestion-service/Dockerfile }
          - { image: test-management-service, context: ., dockerfile: platforms/test-management-service/Dockerfile }
          - { image: dashboard, context: ., dockerfile: dashboard/Dockerfile }
          - { image: gateway, context: gateway, dockerfile: gateway/Dockerfile }
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build -t "qeos/${{ matrix.image }}:scan" -f "${{ matrix.dockerfile }}" "${{ matrix.context }}"

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: qeos/${{ matrix.image }}:scan
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

  # Non-root and a read-only root filesystem with only /tmp writable, as on AKS (ADR-038). The script starts only
  # containers and a network it labels itself, and removes just those
  readonly-images:
    name: Read-only images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build the images
        run: |
          for pair in auth-service:platforms/auth-service/auth-service/Dockerfile                       organization-service:platforms/organization-service/Dockerfile                       project-service:platforms/project-service/Dockerfile                       ingestion-service:platforms/ingestion-service/Dockerfile                       test-management-service:platforms/test-management-service/Dockerfile                       dashboard:dashboard/Dockerfile; do
            docker build -t "qeos/${pair%%:*}:ci" -f "${pair#*:}" .
          done
          docker build -t qeos/gateway:ci gateway

      - name: Check the images
        env:
          IMAGE_TAG: ci
        run: bash scripts/check_readonly_images.sh

  # The Helm chart (ADR-038, spec 5.10) on a throwaway kind cluster: render checks, install with the migration hook,
  # an end-to-end smoke through the gateway, then a failed migration on upgrade must leave the release serving
  helm-kind:
    name: Helm chart on kind
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # deploy/helm/qeos/values-ci.yaml loads qeos/<service>:kind
      TAG: kind
      NAMESPACE: qeos
      CHART: deploy/helm/qeos
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      # helm lint and template with each values file, no secret in any manifest; db-init's secret handling (stub psql).
      # yq (mikefarah v4) is on the runner image
      - name: Chart render checks
        run: |
          yq --version
          bash "$CHART/tests/render_test.sh"
          bash "$CHART/tests/db_init_test.sh"

      - name: Build the images
        run: |
          for pair in auth-service:platforms/auth-service/auth-service/Dockerfile \
                      organization-service:platforms/organization-service/Dockerfile \
                      project-service:platforms/project-service/Dockerfile \
                      ingestion-service:platforms/ingestion-service/Dockerfile \
                      test-management-service:platforms/test-management-service/Dockerfile \
                      dashboard:dashboard/Dockerfile; do
            docker build -t "qeos/${pair%%:*}:$TAG" -f "${pair#*:}" .
          done
          docker build -t "qeos/gateway:$TAG" gateway

      # The node image is the Kubernetes minor AKS creates clusters with by default (1.36, N-1 of AKS's newest GA)
      - uses: helm/kind-action@v1
        with:
          version: v0.33.0
          node_image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
          kubectl_version: v1.36.4
          cluster_name: qeos-kind

      - name: Load the images into kind
        run: |
          images=()
          for name in auth-service organization-service project-service ingestion-service test-management-service \
                      dashboard gateway; do
            images+=("qeos/$name:$TAG")
          done
          kind load docker-image --name qeos-kind "${images[@]}"

      # The Secret the chart reads with secrets.source kubernetes, from values-ci.yaml's dummy values
      - name: Create the namespace and the qeos-secrets Secret
        run: |
          # Dummy values, but never printed: masked before anything (the failure dump's pod logs included) could show one
          while IFS= read -r value; do
            echo "::add-mask::$value"
          done < <(yq '.ciSecrets[]' "$CHART/values-ci.yaml")
          kubectl create namespace "$NAMESPACE"
          mapfile -t literals < <(yq '.ciSecrets | to_entries | .[] | "--from-literal=" + .key + "=" + .value' "$CHART/values-ci.yaml")
          kubectl -n "$NAMESPACE" create secret generic qeos-secrets "${literals[@]}"

      - name: Install the chart
        run: helm install qeos "$CHART" -n "$NAMESPACE" -f "$CHART/values-ci.yaml" --wait --timeout 10m

      - name: Install the collector
        run: python -m pip install --quiet ./collector

      - name: Smoke-test through the gateway
        run: |
          kubectl -n "$NAMESPACE" port-forward svc/gateway 28080:8080 &
          pf=$!
          for _ in $(seq 30); do curl -s --max-time 2 -o /dev/null http://localhost:28080/health && break; sleep 1; done
          status=0
          bash scripts/smoke_k8s.sh http://localhost:28080 "$NAMESPACE" || status=$?
          kill "$pf"
          exit "$status"

      # Each service's image with an `alembic` that starts and exits 1: the realistic failed migration. FROM the :kind
      # images, so only the shim differs; ahead of /usr/local/bin on PATH, outside /tmp (an emptyDir in the hook)
      - name: Build and load the broken-migration images
        run: |
          images=()
          for name in auth-service organization-service project-service ingestion-service test-management-service; do
            printf '%s\n' "FROM qeos/$name:$TAG" "USER 0" \
              "RUN mkdir -p /opt/broken && printf '#!/bin/sh\necho broken migration >&2\nexit 1\n' > /opt/broken/alembic && chmod 755 /opt/broken/alembic" \
              "ENV PATH=/opt/broken:\$PATH" "USER 10001" | docker build -q -t "qeos/$name:broken-migration" -
            images+=("qeos/$name:broken-migration")
          done
          docker run --rm --entrypoint sh qeos/auth-service:broken-migration -c 'alembic upgrade head; test $? = 1'
          kind load docker-image --name qeos-kind "${images[@]}"

      # Review Focus 2: a failed migration fails the upgrade, Helm applies none of the new Deployments, and the running
      # release keeps serving. Twice: a migration that exits 1 (the Job fails at once: backoffLimit 0) and one whose image
      # does not exist (it never starts; the Job fails on its deadline)
      - name: A failed migration leaves the release serving
        run: |
          generations() {
            kubectl -n "$NAMESPACE" get deploy -o jsonpath='{range .items[*]}{.metadata.name}={.metadata.generation} {end}'
          }
          # failed_upgrade CASE REVISIONS REASON [helm args...]: the upgrade fails for REASON, history is REVISIONS
          failed_upgrade() {
            local case="$1" want_revisions="$2" want_reason="$3"
            shift 3
            local before after revisions reason
            before="$(generations)"
            if helm upgrade qeos "$CHART" -n "$NAMESPACE" -f "$CHART/values-ci.yaml" "$@" --wait --timeout 5m; then
              echo "::error::$case: the upgrade succeeded"
              return 1
            fi
            reason="$(kubectl -n "$NAMESPACE" get job qeos-migrate -o jsonpath='{.status.conditions[?(@.type=="Failed")].reason}')"
            if [ "$reason" != "$want_reason" ]; then
              echo "::error::$case: the migration Job failed with '$reason', expected $want_reason"
              return 1
            fi
            helm history qeos -n "$NAMESPACE"
            revisions="$(helm history qeos -n "$NAMESPACE" -o json | yq -p json '[.[] | (.revision | tostring) + ":" + .status] | join(" ")')"
            if [ "$revisions" != "$want_revisions" ]; then
              echo "::error::$case: expected history '$want_revisions', got '$revisions'"
              return 1
            fi
            after="$(generations)"
            if [ "$before" != "$after" ]; then
              echo "::error::$case: the failed upgrade changed Deployments: $before -> $after"
              return 1
            fi
            echo "$case: the upgrade failed ($reason), revision 1 is still deployed, no Deployment changed"
          }

          failed_upgrade "a migration exits 1" "1:deployed 2:failed" BackoffLimitExceeded \
            --set migrate.imageTag=broken-migration
          code="$(kubectl -n "$NAMESPACE" get pods -l job-name=qeos-migrate \
            -o jsonpath='{.items[0].status.initContainerStatuses[?(@.name=="auth-service")].state.terminated.exitCode}')"
          if [ "$code" != 1 ]; then
            echo "::error::the auth-service migration exited with '$code', expected 1"
            exit 1
          fi
          failed_upgrade "a migration image is missing" "1:deployed 2:failed 3:failed" DeadlineExceeded \
            --set migrate.imageTag=does-not-exist --set migrate.activeDeadlineSeconds=60

          kubectl -n "$NAMESPACE" port-forward svc/gateway 28080:8080 &
          pf=$!
          for _ in $(seq 30); do curl -s --max-time 2 -o /dev/null http://localhost:28080/health && break; sleep 1; done
          status=0
          bash scripts/smoke_k8s.sh http://localhost:28080 "$NAMESPACE" --health-only || status=$?
          kill "$pf"
          exit "$status"

      - name: Show cluster state on failure
        if: failure()
        run: |
          helm history qeos -n "$NAMESPACE" || true
          kubectl -n "$NAMESPACE" get all,jobs -o wide || true
          kubectl -n "$NAMESPACE" get events --sort-by=.lastTimestamp || true
          kubectl -n "$NAMESPACE" describe job qeos-migrate || true
          for pod in $(kubectl -n "$NAMESPACE" get pods -o name); do
            echo "::group::$pod"
            kubectl -n "$NAMESPACE" logs "$pod" --all-containers --prefix --tail 200 || true
            echo "::endgroup::"
          done

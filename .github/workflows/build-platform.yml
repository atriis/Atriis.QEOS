name: Build platform images

# Builds the seven platform images, scans each with Trivy and pushes it to Azure Container Registry as :<sha> (ADR-038,
# spec 5.2), after CI succeeded on master. A platform-v* tag builds nothing: it adds :<version> to the images master's
# build already pushed and scanned for that commit, so the version is the very image staging ran (same digest). Safe to
# merge before Azure exists: without the repository variables below it only prints a notice. It signs in as the GitHub
# build identity (AZURE_BUILD_CLIENT_ID: AcrPush only, trusted for master and the release tags; deploy/azure/README.md)
on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
    branches: [ master ]
  push:
    tags: [ "platform-v*" ]

permissions:
  contents: read

# Master's builds run one at a time, in the order their CI runs finished (a newer pending run replaces an older pending
# one, never a running one); deploy-aks.yml also refuses to deploy a commit older than the one deployed. The group is
# keyed on the config job's guard: a run that builds nothing (a failed or cancelled CI run, a fork's PR) gets a group of
# its own, so it can never replace a pending real build. Tags: their own group too
concurrency:
  group: build-platform-${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository) && 'master' || github.run_id }}
  cancel-in-progress: false

jobs:
  # Once for both paths: is Azure configured, and the image list (deploy/images.txt, the commit's own) as the matrix
  config:
    name: Configuration
    # workflow_run fires for every CI run whose branch is named master, a fork PR's included; only a green CI run of a push
    # to this repository builds, since the jobs have the repository's variables and an OIDC token
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag') || (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      configured: ${{ steps.azure.outputs.configured }}
      images: ${{ steps.images.outputs.include }}
    env:
      AZURE_BUILD_CLIENT_ID: ${{ vars.AZURE_BUILD_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ACR_NAME: ${{ vars.ACR_NAME }}
    steps:
      - name: Check that Azure is configured
        id: azure
        run: |
          missing=()
          for name in AZURE_BUILD_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID ACR_NAME; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::notice::Skipping the images: repository variable(s) ${missing[*]} not set (Azure is not configured yet)"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$ACR_NAME" =~ ^[A-Za-z0-9]+$ ]] || { echo "::error::Malformed ACR_NAME '$ACR_NAME'"; exit 1; }
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.azure.outputs.configured == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          sparse-checkout: deploy/images.txt
          sparse-checkout-cone-mode: false

      # [{"image": ..., "context": ..., "dockerfile": ...}, ...] from "name context dockerfile" lines
      - name: Read the image list
        id: images
        if: steps.azure.outputs.configured == 'true'
        run: |
          include="$(jq -Rnc '[inputs | select(test("^\\s*(#|$)") | not) | [splits("\\s+")] | map(select(. != ""))
            | {image: .[0], context: .[1], dockerfile: .[2]}]' deploy/images.txt)"
          [ "$(jq length <<< "$include")" -gt 0 ] || { echo "::error::deploy/images.txt lists no image"; exit 1; }
          echo "include=$include" >> "$GITHUB_OUTPUT"

  images:
    name: Image (${{ matrix.image }})
    needs: config
    if: github.event_name == 'workflow_run' && needs.config.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # The OIDC token azure/login exchanges for an Azure access token (no stored secret)
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # deploy/images.txt: image is the chart's qeos/<image> name; context and dockerfile as in docker-compose.yml
        include: ${{ fromJSON(needs.config.outputs.images) }}
    env:
      AZURE_BUILD_CLIENT_ID: ${{ vars.AZURE_BUILD_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      # The commit CI passed on
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - name: Name the image
        id: name
        run: |
          echo "image=${ACR_NAME}.azurecr.io/qeos/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
          echo "local=qeos/${{ matrix.image }}:scan" >> "$GITHUB_OUTPUT"

      - name: Build
        run: docker build -t "${{ steps.name.outputs.local }}" -f "${{ matrix.dockerfile }}" "${{ matrix.context }}"

      # Fixable CRITICAL findings fail the job before anything is pushed; .trivyignore documents any accepted one
      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.name.outputs.local }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

      - name: Sign in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ env.AZURE_BUILD_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to the registry
        run: az acr login --name "$ACR_NAME"

      - name: Push
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          docker tag "${{ steps.name.outputs.local }}" "$IMAGE:$SHA"
          docker push "$IMAGE:$SHA"

  # A platform-v* tag (platform-v1.2.3 -> :1.2.3) releases what master's build pushed for the tagged commit: no build, no
  # push of :<sha>. Each image's existing :<sha> manifest gets the version as a second tag in the registry, so production
  # runs the same digest staging ran (spec 5.2: built once, immutable, unchanged in every environment)
  release:
    name: Tag the release
    needs: config
    if: github.event_name == 'push' && github.ref_type == 'tag' && needs.config.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # The OIDC token azure/login exchanges for an Azure access token (no stored secret)
      id-token: write
    env:
      AZURE_BUILD_CLIENT_ID: ${{ vars.AZURE_BUILD_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      # The tagged commit
      SHA: ${{ github.sha }}
    steps:
      - name: Read the version
        run: |
          version="${GITHUB_REF_NAME#platform-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$GITHUB_REF_NAME is not platform-v<major>.<minor>.<patch>"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          # The tag check needs master's history
          fetch-depth: 0

      # A platform-v* tag releases what master has: a tag on any other commit releases nothing
      - name: Check that the tag is on master
        run: |
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$SHA" FETCH_HEAD; then
            echo "::error::$GITHUB_REF_NAME ($SHA) is not on master"
            exit 1
          fi

      - name: Sign in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ env.AZURE_BUILD_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to the registry
        run: az acr login --name "$ACR_NAME"

      # Nothing is tagged until every check has passed for all seven: each :<sha> exists, no :<version> points at another
      # image, and what imagetools would push is the :<sha> manifest itself (--dry-run). --prefer-index=false: by default
      # imagetools wraps a single image manifest in a new index, a different digest. AcrPush is enough for this, where
      # az acr import needs a control-plane role; but it cannot delete a tag, so a wrong :<version> must never be pushed.
      # After each push the two digests are compared once more
      - name: Tag the images with the version
        run: |
          # deploy/images.txt: the first word of each line that is not a comment
          mapfile -t images < <(awk '!/^[[:space:]]*(#|$)/ {print $1}' deploy/images.txt)
          [ "${#images[@]}" -gt 0 ] || { echo "::error::deploy/images.txt lists no image"; exit 1; }
          # digest NAME TAG: the manifest digest of qeos/NAME:TAG, empty when the registry has no such tag; any other
          # failure (sign-in, permission, network) is printed and stops the step
          digest() {
            local out
            if out="$(az acr repository show --name "$ACR_NAME" --image "qeos/$1:$2" --query digest -o tsv 2>&1)"; then
              echo "$out"
            elif grep -qiE 'manifest unknown|manifest_unknown|name unknown|name_unknown|not found' <<< "$out"; then
              echo ""
            else
              echo "::error::Could not read qeos/$1:$2 in $ACR_NAME: $out" >&2
              return 1
            fi
          }
          declare -A want
          missing=()
          for name in "${images[@]}"; do
            want[$name]="$(digest "$name" "$SHA")"
            [ -n "${want[$name]}" ] || missing+=("qeos/$name:$SHA")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Not in $ACR_NAME: ${missing[*]}. A release only tags the images master's build pushed and scanned for $SHA: let Build platform images finish (or rerun it) for that commit on master, then rerun this job"
            exit 1
          fi
          for name in "${images[@]}"; do
            image="$ACR_NAME.azurecr.io/qeos/$name"
            have="$(digest "$name" "$VERSION")"
            if [ -n "$have" ] && [ "$have" != "${want[$name]}" ]; then
              echo "::error::qeos/$name:$VERSION already exists for another image ($have): a version is never moved"
              exit 1
            fi
            planned="$(docker buildx imagetools create --prefer-index=false --dry-run --tag "$image:$VERSION" "$image@${want[$name]}" | jq -S -c .)"
            source="$(docker buildx imagetools inspect --raw "$image@${want[$name]}" | jq -S -c .)"
            if [ -z "$source" ] || [ "$planned" != "$source" ]; then
              echo "::error::imagetools would not copy qeos/$name:$SHA as it is (another manifest, another digest): nothing tagged"
              exit 1
            fi
          done
          for name in "${images[@]}"; do
            image="$ACR_NAME.azurecr.io/qeos/$name"
            docker buildx imagetools create --prefer-index=false --tag "$image:$VERSION" "$image@${want[$name]}"
            got="$(digest "$name" "$VERSION")"
            if [ "$got" != "${want[$name]}" ]; then
              echo "::error::qeos/$name:$VERSION is $got, not the digest of :$SHA (${want[$name]}). Someone with AcrDelete must remove it (az acr repository untag --name $ACR_NAME --image qeos/$name:$VERSION) before a rerun"
              exit 1
            fi
            echo "qeos/$name:$VERSION = qeos/$name:$SHA (${want[$name]})"
          done

  # Records the commit every image was pushed for, as the artifact built-sha, once all seven pushed. deploy-aks.yml
  # deploys exactly this commit, never master's tip of the moment (which may have moved on since CI ran)
  built:
    name: Record the built commit
    needs: images
    # Skipped images (Azure not configured, or a tag) never succeed
    if: github.event_name == 'workflow_run' && needs.images.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Write the commit
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Unexpected commit '$SHA'"; exit 1; }
          echo "$SHA" > "$RUNNER_TEMP/built-sha.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: built-sha
          path: ${{ runner.temp }}/built-sha.txt
          retention-days: 7
          if-no-files-found: error

version: 2
updates:
  # Python: each service pins its own requirements.txt; shared and the collector use pyproject.toml.
  # The repository root holds no Python manifest, which is why "/" alone failed ("No files found in /").
  - package-ecosystem: "pip"
    directories:
      - "/platforms/auth-service/auth-service"
      - "/platforms/organization-service"
      - "/platforms/project-service"
      - "/platforms/ingestion-service"
      - "/platforms/test-management-service"
      - "/shared"
      - "/collector"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      include: "scope"
    pull-request-branch-name:
      separator: "-"
    ignore:
      # bcrypt 5 breaks passlib (auth-service): hashing raises "password cannot be longer than 72 bytes"
      - dependency-name: "bcrypt"
        versions: [">=5"]
    groups:
      # One PR for every minor/patch bump across all Python directories
      python-minor-patch:
        update-types: ["minor", "patch"]
      # Major bumps: one PR per dependency, covering every directory that uses it
      python-major:
        update-types: ["major"]
        group-by: dependency-name

  # Dashboard (npm)
  - package-ecosystem: "npm"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint 8.71 accepts TypeScript below 6.1 only (peerDependencies), so a newer
      # TypeScript makes npm ci fail. Lift this once typescript-eslint widens its range.
      - dependency-name: "typescript"
        versions: [">= 6.1.0"]
    groups:
      # Packages that must move together arrive in one PR, majors included.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      eslint:
        patterns: ["eslint", "@eslint/js", "typescript-eslint", "eslint-plugin-*"]
      vite-test:
        patterns: ["vite", "@vitejs/*", "vitest", "@vitest/*", "msw", "jsdom"]
      npm-minor-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]

  # Base images of every Dockerfile (the nginx images are pinned by digest, the Python ones by tag)
  - package-ecosystem: "docker"
    directories:
      - "/dashboard"
      - "/gateway"
      - "/platforms/auth-service/auth-service"
      - "/platforms/organization-service"
      - "/platforms/project-service"
      - "/platforms/ingestion-service"
      - "/platforms/test-management-service"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      docker-base-images:
        patterns: ["*"]

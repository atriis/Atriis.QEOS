# The whole platform on one host: `SECRET_KEY=... INTERNAL_API_PASSWORD=... docker compose up -d --build --wait gateway`.
# Each service's own docker-compose.yml under platforms/ still works for developing it alone;
# this stack uses its own volumes and never touches theirs.
name: qa-vision

x-app-healthcheck: &app-healthcheck
  # The slim images have no curl; probe with Python's stdlib
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
  interval: 5s
  timeout: 5s
  retries: 12
  start_period: 10s

# Each service and its -migrate job share one environment block, so they cannot drift apart.

# Outgoing email (qeos_shared.mail), set in .env. Empty SMTP_HOST: no email is sent; auth logs
# its links instead, and email notification channels record "SMTP is not configured"
x-smtp-env: &smtp-env
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_TLS: ${SMTP_TLS:-true}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL:-}
  EMAILS_FROM_NAME: ${EMAILS_FROM_NAME:-QEOS}

x-auth-env: &auth-env
  <<: *smtp-env
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/auth_db
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY (shared by every service)}
  # Links in verification emails must point at the gateway, the only published entry point
  BASE_URL: https://localhost:${GATEWAY_HTTPS_PORT:-8443}
  # Internal API (GET /internal/v1/users/{id}), used by organization-service's member add
  INTERNAL_API_PASSWORD: ${INTERNAL_API_PASSWORD:?set INTERNAL_API_PASSWORD (service-to-service internal APIs; URL-safe characters)}

x-organization-env: &organization-env
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/organization_db
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY (shared by every service)}
  AUTH_SERVICE_URL: http://auth-service:8000
  # Credentials for auth-service's internal user-existence check (member add)
  INTERNAL_API_PASSWORD: ${INTERNAL_API_PASSWORD:?set INTERNAL_API_PASSWORD (service-to-service internal APIs; URL-safe characters)}

x-project-env: &project-env
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/project_db
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY (shared by every service)}
  ORGANIZATION_SERVICE_URL: http://organization-service:8000
  # Internal API (GET /internal/v1/projects/retention), used by ingestion-retention
  INTERNAL_API_PASSWORD: ${INTERNAL_API_PASSWORD:?set INTERNAL_API_PASSWORD (project-service's internal API; URL-safe characters)}

x-ingestion-env: &ingestion-env
  <<: *smtp-env
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/ingestion_db
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY (shared by every service)}
  PROJECT_SERVICE_URL: http://project-service:8000
  # Run links in failure notifications (Slack/Teams/webhook) point at the gateway
  DASHBOARD_URL: https://localhost:${GATEWAY_HTTPS_PORT:-8443}

x-testmgmt-env: &testmgmt-env
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/testmgmt_db
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY (shared by every service)}
  PROJECT_SERVICE_URL: http://project-service:8000
  IMPORT_MAX_FILES: ${IMPORT_MAX_FILES:-2000}
  IMPORT_MAX_FILE_BYTES: ${IMPORT_MAX_FILE_BYTES:-262144}
  IMPORT_MAX_TOTAL_BYTES: ${IMPORT_MAX_TOTAL_BYTES:-10485760}
  TM_SECRETS_KEY: ${TM_SECRETS_KEY:-}

x-auth-build: &auth-build
  context: .
  dockerfile: platforms/auth-service/auth-service/Dockerfile

x-organization-build: &organization-build
  context: .
  dockerfile: platforms/organization-service/Dockerfile

x-project-build: &project-build
  context: .
  dockerfile: platforms/project-service/Dockerfile

x-ingestion-build: &ingestion-build
  context: .
  dockerfile: platforms/ingestion-service/Dockerfile

x-testmgmt-build: &testmgmt-build
  context: .
  dockerfile: platforms/test-management-service/Dockerfile

x-dashboard-build: &dashboard-build
  context: .
  dockerfile: dashboard/Dockerfile
  args:
    # Must match auth-service's GOOGLE_CLIENT_ID / Entra app; empty hides the button
    VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    VITE_MSAL_CLIENT_ID: ${VITE_MSAL_CLIENT_ID:-}
    VITE_MSAL_AUTHORITY: ${VITE_MSAL_AUTHORITY:-}

services:
  postgres:
    image: postgres:15
    # pg_stat_statements for the monitoring profile's slowest-statements panel (Ruling 10). Loading it
    # costs a few MB of shared memory and changes nothing else
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - qeos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Over TCP, not the Unix socket: on a fresh volume the image first runs a temporary,
      # socket-only server for initialisation, and a socket check can pass on that one --
      # db-init (which connects over TCP) would then be refused.
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 3s
      timeout: 3s
      retries: 20
    # No ports: inspect with `docker compose exec postgres psql -U postgres -d project_db`

  db-init:
    image: postgres:15
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Empty unless monitoring is on: then postgres-init.sh creates role qeos_monitor (pg_monitor only)
      MONITORING_DB_PASSWORD: ${MONITORING_DB_PASSWORD:-}
    volumes:
      - ./scripts/postgres-init.sh:/postgres-init.sh:ro
    entrypoint: ["sh", "/postgres-init.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  auth-migrate:
    # Same image as auth-service, which builds it; never pulled from a registry
    image: qa-vision/auth-service:local
    pull_policy: never
    environment: *auth-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db-init:
        condition: service_completed_successfully

  organization-migrate:
    # Same image as organization-service, which builds it; never pulled from a registry
    image: qa-vision/organization-service:local
    pull_policy: never
    environment: *organization-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db-init:
        condition: service_completed_successfully

  project-migrate:
    # Same image as project-service, which builds it; never pulled from a registry
    image: qa-vision/project-service:local
    pull_policy: never
    environment: *project-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db-init:
        condition: service_completed_successfully

  ingestion-migrate:
    # Same image as ingestion-service, which builds it; never pulled from a registry
    image: qa-vision/ingestion-service:local
    pull_policy: never
    environment: *ingestion-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db-init:
        condition: service_completed_successfully

  test-management-migrate:
    # Same image as test-management-service, which builds it; never pulled from a registry
    image: qa-vision/test-management-service:local
    pull_policy: never
    environment: *testmgmt-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db-init:
        condition: service_completed_successfully

  auth-service:
    build: *auth-build
    image: qa-vision/auth-service:local
    environment: *auth-env
    healthcheck: *app-healthcheck
    depends_on:
      auth-migrate:
        condition: service_completed_successfully

  organization-service:
    build: *organization-build
    image: qa-vision/organization-service:local
    environment: *organization-env
    healthcheck: *app-healthcheck
    depends_on:
      organization-migrate:
        condition: service_completed_successfully

  project-service:
    build: *project-build
    image: qa-vision/project-service:local
    environment: *project-env
    healthcheck: *app-healthcheck
    depends_on:
      project-migrate:
        condition: service_completed_successfully

  ingestion-service:
    build: *ingestion-build
    image: qa-vision/ingestion-service:local
    environment: *ingestion-env
    healthcheck: *app-healthcheck
    depends_on:
      ingestion-migrate:
        condition: service_completed_successfully

  # Test cases and suites (ADR-022)
  test-management-service:
    build: *testmgmt-build
    image: qa-vision/test-management-service:local
    environment: *testmgmt-env
    healthcheck: *app-healthcheck
    depends_on:
      test-management-migrate:
        condition: service_completed_successfully

  # Deletes runs past each project's retention period: a pass at start-up, then every
  # RETENTION_INTERVAL_HOURS. One pass at a time across copies (PostgreSQL advisory lock).
  ingestion-retention:
    # Same image as ingestion-service, which builds it; never pulled from a registry
    image: qa-vision/ingestion-service:local
    pull_policy: never
    environment:
      <<: *ingestion-env
      # HTTP Basic credentials as a connection string; the password must be URL-safe here
      PROJECT_SERVICE_INTERNAL_URL: http://ingestion-service:${INTERNAL_API_PASSWORD:?set INTERNAL_API_PASSWORD (project-service's internal API; URL-safe characters)}@project-service:8000
    command: ["python", "-m", "src.ingestion.jobs.retention", "--loop"]
    depends_on:
      ingestion-migrate:
        condition: service_completed_successfully
      project-service:
        condition: service_healthy

  dashboard:
    build: *dashboard-build
    image: qa-vision/dashboard:local
    restart: unless-stopped
    # nginx:alpine has no python; busybox wget instead of the shared healthcheck
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget prefers ::1 and nginx listens on IPv4 only
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Keeps the flaky_daily rollups current: backfill on start, then every 6 hours.
  analytics-rollup:
    image: qa-vision/ingestion-service:local
    pull_policy: never
    environment: *ingestion-env
    command: ["python", "-m", "src.ingestion.jobs.rollup", "--loop"]
    depends_on:
      ingestion-migrate:
        condition: service_completed_successfully

  # Sends last week's summary to channels that ask for it, Mondays from
  # WEEKLY_SUMMARY_HOUR_UTC; once per channel per week (see the job's docstring)
  weekly-summary:
    image: qa-vision/ingestion-service:local
    pull_policy: never
    environment: *ingestion-env
    command: ["python", "-m", "src.ingestion.jobs.weekly_summary", "--loop"]
    depends_on:
      ingestion-migrate:
        condition: service_completed_successfully

  gateway:
    build: ./gateway
    image: qa-vision/gateway:local
    ports:
      - "${GATEWAY_HTTPS_PORT:-8443}:443"
      - "${GATEWAY_HTTP_PORT:-8080}:80"
    environment:
      # Must equal the published HTTPS port: the HTTP -> HTTPS redirect is built from it
      GATEWAY_HTTPS_PORT: ${GATEWAY_HTTPS_PORT:-8443}
      GATEWAY_IMPORT_MAX_BODY: ${GATEWAY_IMPORT_MAX_BODY:-25m}
    volumes:
      - qeos_gateway_certs:/etc/nginx/certs
    healthcheck:
      test: ["CMD", "curl", "-fsk", "https://localhost/health"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      auth-service:
        condition: service_healthy
      organization-service:
        condition: service_healthy
      project-service:
        condition: service_healthy
      ingestion-service:
        condition: service_healthy
      test-management-service:
        condition: service_healthy
      dashboard:
        condition: service_healthy
      # Not needed by the gateway; listed so `docker compose up gateway` starts the whole platform
      ingestion-retention:
        condition: service_started
      analytics-rollup:
        condition: service_started
      weekly-summary:
        condition: service_started

volumes:
  # Explicit names: the physical volumes keep the names they had before the QEOS rename
  # (compose project "qa-vision", keys "qav_*"), so no data moves and nothing is recreated.
  qeos_postgres_data:
    name: qa-vision_qav_postgres_data
  qeos_gateway_certs:
    name: qa-vision_qav_gateway_certs

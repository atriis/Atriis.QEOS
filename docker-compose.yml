# The whole platform on one host: `SECRET_KEY=... INTERNAL_API_PASSWORD=... docker compose up -d --build --wait gateway`.
# Each service's own docker-compose.yml under platforms/ still works for developing it alone;
# this stack uses its own volumes and never touches theirs.
name: qeos

x-app-healthcheck: &app-healthcheck
  # The slim images have no curl; probe with Python's stdlib
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
  interval: 5s
  timeout: 5s
  retries: 12
  start_period: 10s

# Each service and its -migrate job share one environment block, so they cannot drift apart.

# Outgoing email (qeos_shared.mail), set in .env. Empty SMTP_HOST: no email is sent; auth logs
# its links instead, and email notification channels record "SMTP is not configured"
x-smtp-env: &smtp-env
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_TLS: ${SMTP_TLS:-true}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL:-}
  EMAILS_FROM_NAME: ${EMAILS_FROM_NAME:-QEOS}

# build_info{version, commit} on every service's /metrics (Ruling 14). Set QEOS_COMMIT on update:
#   QEOS_COMMIT=$(git rev-parse --short HEAD) docker compose up -d --build --wait gateway
x-build-env: &build-env
  QEOS_VERSION: ${QEOS_VERSION:-dev}
  QEOS_COMMIT: ${QEOS_COMMIT:-unknown}

x-auth-env: &auth-env
  <<: [*smtp-env, *build-env]
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/auth_db
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY (shared by every service)}
  # Links in verification emails must point at the gateway, the only published entry point
  BASE_URL: https://localhost:${GATEWAY_HTTPS_PORT:-8443}
  # Internal API (GET /internal/v1/users/{id}), used by organization-service's member add
  INTERNAL_API_PASSWORD: ${INTERNAL_API_PASSWORD:?set INTERNAL_API_PASSWORD (service-to-service internal APIs; URL-safe characters)}
  # Offer Grafana to superusers (ADR-027); set with COMPOSE_PROFILES=monitoring
  MONITORING_ENABLED: ${MONITORING_ENABLED:-false}
  # Microsoft sign-in (SETUP section 3.8) and SSO-only mode (ADR-031). Empty Azure values leave Microsoft off;
  # with AUTH_SSO_ONLY=true auth-service refuses to start unless every provider in AUTH_SSO_PROVIDERS is configured
  AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
  AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
  AZURE_ALLOWED_TENANTS: ${AZURE_ALLOWED_TENANTS:-}
  AUTH_SSO_ONLY: ${AUTH_SSO_ONLY:-false}
  AUTH_SSO_PROVIDERS: ${AUTH_SSO_PROVIDERS:-microsoft}
  # Entra app roles (ADR-033): a Microsoft sign-in's roles go to organization-service's internal API
  ORGANIZATION_SERVICE_URL: http://organization-service:8000
  ORGANIZATION_INTERNAL_API_PASSWORD: ${INTERNAL_API_PASSWORD:?set INTERNAL_API_PASSWORD (service-to-service internal APIs; URL-safe characters)}

x-organization-env: &organization-env
  <<: *build-env
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/organization_db
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY (shared by every service)}
  AUTH_SERVICE_URL: http://auth-service:8000
  # Credentials for auth-service's internal user-existence check (member add)
  INTERNAL_API_PASSWORD: ${INTERNAL_API_PASSWORD:?set INTERNAL_API_PASSWORD (service-to-service internal APIs; URL-safe characters)}

x-project-env: &project-env
  <<: *build-env
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/project_db
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY (shared by every service)}
  ORGANIZATION_SERVICE_URL: http://organization-service:8000
  # Internal API (GET /internal/v1/projects/retention), used by ingestion-retention
  INTERNAL_API_PASSWORD: ${INTERNAL_API_PASSWORD:?set INTERNAL_API_PASSWORD (project-service's internal API; URL-safe characters)}
  # Days a deleted project stays restorable before it is purged; ingestion-retention reads the same value
  PROJECT_DELETE_GRACE_DAYS: ${PROJECT_DELETE_GRACE_DAYS:-7}

x-ingestion-env: &ingestion-env
  <<: [*smtp-env, *build-env]
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/ingestion_db
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY (shared by every service)}
  PROJECT_SERVICE_URL: http://project-service:8000
  # project-service's internal feed, with HTTP Basic credentials as a connection string (the password must be
  # URL-safe here): retention reads it, and uploads to a project pending deletion are refused (spec 2026-10-16)
  PROJECT_SERVICE_INTERNAL_URL: http://ingestion-service:${INTERNAL_API_PASSWORD:?set INTERNAL_API_PASSWORD (project-service's internal API; URL-safe characters)}@project-service:8000
  # Run links in failure notifications (Slack/Teams/webhook) point at the gateway
  DASHBOARD_URL: https://localhost:${GATEWAY_HTTPS_PORT:-8443}

# Artifact storage for screenshots (ADR-036). ingestion-service and ingestion-retention only. The one key pair is
# MinIO's root user: ingestion is its only client. deploy/docker-compose.prod.yml requires the secret.
x-artifacts-env: &artifacts-env
  ARTIFACTS_S3_ENDPOINT: http://minio:9000
  ARTIFACTS_S3_BUCKET: qeos-artifacts
  ARTIFACTS_S3_ACCESS_KEY: ${ARTIFACTS_S3_ACCESS_KEY:-qeos}
  ARTIFACTS_S3_SECRET_KEY: ${ARTIFACTS_S3_SECRET_KEY:-qeos-minio-dev}

x-testmgmt-env: &testmgmt-env
  <<: *build-env
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/testmgmt_db
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY (shared by every service)}
  PROJECT_SERVICE_URL: http://project-service:8000
  IMPORT_MAX_FILES: ${IMPORT_MAX_FILES:-2000}
  IMPORT_MAX_FILE_BYTES: ${IMPORT_MAX_FILE_BYTES:-262144}
  IMPORT_MAX_TOTAL_BYTES: ${IMPORT_MAX_TOTAL_BYTES:-10485760}
  TM_SECRETS_KEY: ${TM_SECRETS_KEY:-}
  # Internal API (DELETE /internal/v1/projects/{id}), called by ingestion's purge job (spec 2026-10-16)
  INTERNAL_API_PASSWORD: ${INTERNAL_API_PASSWORD:?set INTERNAL_API_PASSWORD (service-to-service internal APIs; URL-safe characters)}

x-auth-build: &auth-build
  context: .
  dockerfile: platforms/auth-service/auth-service/Dockerfile

x-organization-build: &organization-build
  context: .
  dockerfile: platforms/organization-service/Dockerfile

x-project-build: &project-build
  context: .
  dockerfile: platforms/project-service/Dockerfile

x-ingestion-build: &ingestion-build
  context: .
  dockerfile: platforms/ingestion-service/Dockerfile

x-testmgmt-build: &testmgmt-build
  context: .
  dockerfile: platforms/test-management-service/Dockerfile

x-dashboard-build: &dashboard-build
  context: .
  dockerfile: dashboard/Dockerfile
  args:
    # Must match auth-service's GOOGLE_CLIENT_ID / Entra app; empty hides the button
    VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    VITE_MSAL_CLIENT_ID: ${VITE_MSAL_CLIENT_ID:-}
    VITE_MSAL_AUTHORITY: ${VITE_MSAL_AUTHORITY:-}

services:
  postgres:
    image: postgres:15
    # pg_stat_statements for the monitoring profile's slowest-statements panel (Ruling 10). Loading it
    # costs a few MB of shared memory and changes nothing else
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - qeos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Over TCP, not the Unix socket: on a fresh volume the image first runs a temporary,
      # socket-only server for initialisation, and a socket check can pass on that one --
      # db-init (which connects over TCP) would then be refused.
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 3s
      timeout: 3s
      retries: 20
    # No ports: inspect with `docker compose exec postgres psql -U postgres -d project_db`

  db-init:
    image: postgres:15
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Empty unless you set it in .env (init-env.sh writes it commented out, so a new install has no such
      # role until monitoring is turned on): then postgres-init.sh creates role qeos_monitor (pg_monitor only)
      MONITORING_DB_PASSWORD: ${MONITORING_DB_PASSWORD:-}
    volumes:
      - ./scripts/postgres-init.sh:/postgres-init.sh:ro
    entrypoint: ["sh", "/postgres-init.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  auth-migrate:
    # Same image as auth-service, which builds it; never pulled from a registry
    image: qeos/auth-service:local
    pull_policy: never
    environment: *auth-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db-init:
        condition: service_completed_successfully

  organization-migrate:
    # Same image as organization-service, which builds it; never pulled from a registry
    image: qeos/organization-service:local
    pull_policy: never
    environment: *organization-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db-init:
        condition: service_completed_successfully

  project-migrate:
    # Same image as project-service, which builds it; never pulled from a registry
    image: qeos/project-service:local
    pull_policy: never
    environment: *project-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db-init:
        condition: service_completed_successfully

  ingestion-migrate:
    # Same image as ingestion-service, which builds it; never pulled from a registry
    image: qeos/ingestion-service:local
    pull_policy: never
    environment: *ingestion-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db-init:
        condition: service_completed_successfully

  test-management-migrate:
    # Same image as test-management-service, which builds it; never pulled from a registry
    image: qeos/test-management-service:local
    pull_policy: never
    environment: *testmgmt-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db-init:
        condition: service_completed_successfully

  auth-service:
    build: *auth-build
    image: qeos/auth-service:local
    environment: *auth-env
    healthcheck: *app-healthcheck
    depends_on:
      auth-migrate:
        condition: service_completed_successfully

  organization-service:
    build: *organization-build
    image: qeos/organization-service:local
    environment: *organization-env
    healthcheck: *app-healthcheck
    depends_on:
      organization-migrate:
        condition: service_completed_successfully

  project-service:
    build: *project-build
    image: qeos/project-service:local
    environment: *project-env
    healthcheck: *app-healthcheck
    depends_on:
      project-migrate:
        condition: service_completed_successfully

  ingestion-service:
    build: *ingestion-build
    image: qeos/ingestion-service:local
    environment:
      <<: [*ingestion-env, *artifacts-env]
    healthcheck: *app-healthcheck
    depends_on:
      ingestion-migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  # Object storage for screenshots (ADR-036). Not published: only ingestion reaches it, on the compose network.
  # The image is pinned by digest (Chainguard's build of MinIO, which has the mc client too: MinIO stopped
  # publishing images on Docker Hub); to update, pull the new image and copy its digest here and in minio-init.
  minio:
    image: cgr.dev/chainguard/minio@sha256:709099319add48dfb44aa596a7070d3ddd8dd04d7ae881765719aec29df9e510
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${ARTIFACTS_S3_ACCESS_KEY:-qeos}
      MINIO_ROOT_PASSWORD: ${ARTIFACTS_S3_SECRET_KEY:-qeos-minio-dev}
      # The alias "local" for the healthcheck below, pointing at this container itself
      MC_HOST_local: http://${ARTIFACTS_S3_ACCESS_KEY:-qeos}:${ARTIFACTS_S3_SECRET_KEY:-qeos-minio-dev}@127.0.0.1:9000
      # Prometheus scrapes /minio/v2/metrics/cluster without a token (monitoring profile). Safe only because MinIO
      # has no published port: the metrics are readable from the compose network, never from the host or outside
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - qeos_minio_data:/data
    healthcheck:
      # The image has no shell or curl: mc's own readiness probe against the alias set by MC_HOST_local above
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  # Creates the private bucket once and exits. No anonymous policy is set: every read goes through ingestion.
  minio-init:
    image: cgr.dev/chainguard/minio@sha256:709099319add48dfb44aa596a7070d3ddd8dd04d7ae881765719aec29df9e510
    entrypoint: ["mc", "mb", "--ignore-existing", "local/qeos-artifacts"]
    environment:
      MC_HOST_local: http://${ARTIFACTS_S3_ACCESS_KEY:-qeos}:${ARTIFACTS_S3_SECRET_KEY:-qeos-minio-dev}@minio:9000
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  # Test cases and suites (ADR-022)
  test-management-service:
    build: *testmgmt-build
    image: qeos/test-management-service:local
    environment: *testmgmt-env
    healthcheck: *app-healthcheck
    depends_on:
      test-management-migrate:
        condition: service_completed_successfully

  # Deletes runs past each project's retention period: a pass at start-up, then every
  # RETENTION_INTERVAL_HOURS. One pass at a time across copies (PostgreSQL advisory lock).
  ingestion-retention:
    # Same image as ingestion-service, which builds it; never pulled from a registry
    image: qeos/ingestion-service:local
    pull_policy: never
    environment:
      <<: [*ingestion-env, *artifacts-env]
      # test-management's internal API, for the purge of deleted projects after PROJECT_DELETE_GRACE_DAYS (spec 2026-10-16)
      TEST_MANAGEMENT_INTERNAL_URL: http://ingestion-service:${INTERNAL_API_PASSWORD:?set INTERNAL_API_PASSWORD (service-to-service internal APIs; URL-safe characters)}@test-management-service:8000
      PROJECT_DELETE_GRACE_DAYS: ${PROJECT_DELETE_GRACE_DAYS:-7}
    command: ["python", "-m", "src.ingestion.jobs.retention", "--loop"]
    depends_on:
      ingestion-migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      project-service:
        condition: service_healthy
      # Started, not healthy: live projects' retention must not wait on it; a purge it cannot reach resumes later
      test-management-service:
        condition: service_started

  dashboard:
    build: *dashboard-build
    image: qeos/dashboard:local
    restart: unless-stopped
    # nginx:alpine has no python; busybox wget instead of the shared healthcheck
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget prefers ::1 and nginx listens on IPv4 only
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Keeps the flaky_daily rollups current: backfill on start, then every 6 hours.
  analytics-rollup:
    image: qeos/ingestion-service:local
    pull_policy: never
    environment: *ingestion-env
    command: ["python", "-m", "src.ingestion.jobs.rollup", "--loop"]
    depends_on:
      ingestion-migrate:
        condition: service_completed_successfully

  # Rebuilds the test impact statistics (impact_pairs, impact_test_base): one pass on start, then every 24 hours.
  impact-rollup:
    image: qeos/ingestion-service:local
    pull_policy: never
    environment: *ingestion-env
    command: ["python", "-m", "src.ingestion.jobs.impact_rollup", "--loop"]
    depends_on:
      ingestion-migrate:
        condition: service_completed_successfully

  # Sends last week's summary to channels that ask for it, Mondays from
  # WEEKLY_SUMMARY_HOUR_UTC; once per channel per week (see the job's docstring)
  weekly-summary:
    image: qeos/ingestion-service:local
    pull_policy: never
    environment: *ingestion-env
    command: ["python", "-m", "src.ingestion.jobs.weekly_summary", "--loop"]
    depends_on:
      ingestion-migrate:
        condition: service_completed_successfully

  gateway:
    build: ./gateway
    image: qeos/gateway:local
    ports:
      - "${GATEWAY_HTTPS_PORT:-8443}:443"
      - "${GATEWAY_HTTP_PORT:-8080}:80"
    environment:
      # Must equal the published HTTPS port: the HTTP -> HTTPS redirect is built from it
      GATEWAY_HTTPS_PORT: ${GATEWAY_HTTPS_PORT:-8443}
      GATEWAY_IMPORT_MAX_BODY: ${GATEWAY_IMPORT_MAX_BODY:-25m}
      # /grafana/ gated by auth-service when true, a 404 otherwise (ADR-027)
      MONITORING_ENABLED: ${MONITORING_ENABLED:-false}
    volumes:
      - qeos_gateway_certs:/etc/nginx/certs
    networks:
      default:
      # The one address Grafana's auth proxy trusts (monitoring profile); the network exists either way
      grafana-front:
        ipv4_address: ${GATEWAY_GRAFANA_FRONT_IP:-172.30.1.10}
    healthcheck:
      test: ["CMD", "curl", "-fsk", "https://localhost/health"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      auth-service:
        condition: service_healthy
      organization-service:
        condition: service_healthy
      project-service:
        condition: service_healthy
      ingestion-service:
        condition: service_healthy
      test-management-service:
        condition: service_healthy
      dashboard:
        condition: service_healthy
      # Not needed by the gateway; listed so `docker compose up gateway` starts the whole platform
      ingestion-retention:
        condition: service_started
      analytics-rollup:
        condition: service_started
      impact-rollup:
        condition: service_started
      weekly-summary:
        condition: service_started

  # ---- monitoring profile (spec 2026-10-10, ADR-027): COMPOSE_PROFILES=monitoring in .env turns it on ----
  # Nothing here publishes a port to the internet; Grafana is reached through the gateway at /grafana/
  # and, for break-glass, on 127.0.0.1:3000 of the host only. Networks: Prometheus and postgres-exporter
  # also join the platform's network (to scrape the services, to reach PostgreSQL); Grafana does not, so
  # no service container can resolve or route to it, only the gateway over grafana-front. Docker still
  # opens a published port on the container's address to every container on the host, so the
  # break-glass port is reachable by IP; that is why the auth proxy trusts the gateway's address only.

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    restart: unless-stopped
    mem_limit: 512m
    # Renders /tmp/thresholds.yml from POSTGRES_DB_SIZE_ALERT_GB, then runs Prometheus with `command`
    entrypoint: ["/bin/sh", "/etc/qeos/prometheus/entrypoint.sh"]
    command:
      - --config.file=/etc/qeos/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-5GB}
    environment:
      POSTGRES_DB_SIZE_ALERT_GB: ${POSTGRES_DB_SIZE_ALERT_GB:-20}
    volumes:
      # The layout monitoring/check.sh validates: prometheus.yml names its rule files under /etc/qeos
      - ./monitoring:/etc/qeos:ro
      - qeos_prometheus_data:/prometheus
    networks: [default, monitoring]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 12

  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: [monitoring]
    restart: unless-stopped
    mem_limit: 64m
    # The config is rendered from the environment at every start (unset channels are left out)
    entrypoint: ["/bin/sh", "-c", "sh /etc/qeos/alertmanager/render.sh /tmp/alertmanager.yml && exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager"]
    environment:
      <<: *smtp-env
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_SLACK_WEBHOOK_URL: ${ALERT_SLACK_WEBHOOK_URL:-}
      ALERT_TEAMS_WEBHOOK_URL: ${ALERT_TEAMS_WEBHOOK_URL:-}
    volumes:
      - ./monitoring/alertmanager:/etc/qeos/alertmanager:ro
    networks: [monitoring]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9093/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 12

  grafana:
    image: grafana/grafana:12.0.2
    profiles: [monitoring]
    restart: unless-stopped
    mem_limit: 256m
    # Refuses to start without an admin password (Ruling 17): an empty one would mean admin/admin
    entrypoint: ["/bin/sh", "-c", "if [ -z \"$$GF_SECURITY_ADMIN_PASSWORD\" ]; then echo 'grafana: set GRAFANA_ADMIN_PASSWORD in .env' >&2; exit 1; fi; exec /run.sh"]
    environment:
      GF_SERVER_ROOT_URL: https://localhost:${GATEWAY_HTTPS_PORT:-8443}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # The gateway location carries no WebSockets (Ruling 13)
      GF_LIVE_MAX_CONNECTIONS: "0"
      # Data source and dashboards come from the repository, read-only (monitoring/grafana)
      GF_PATHS_PROVISIONING: /etc/qeos/grafana/provisioning
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/qeos/grafana/dashboards/overview.json
      # Signed in by the gateway (ADR-027): it sets this header from auth-service's check and always
      # overwrites a client's. A user is created on first visit, as an Admin of the main organization
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-QEOS-User-Email
      GF_AUTH_PROXY_HEADER_PROPERTY: email
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Admin
      # The header is believed from the gateway's fixed grafana-front address only
      GF_AUTH_PROXY_WHITELIST: ${GATEWAY_GRAFANA_FRONT_IP:-172.30.1.10}
      # The login form and basic auth stay on for the break-glass admin on 127.0.0.1:3000 (the same
      # Grafana: GF_AUTH_DISABLE_LOGIN_FORM would hide the form there too). Through the gateway nobody
      # reaches the form without passing auth-service's check first
    ports:
      # Break-glass admin login when auth-service is down: ssh -L 3000:127.0.0.1:3000 <vm>
      - "127.0.0.1:3000:3000"
    volumes:
      - qeos_grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/qeos/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/qeos/grafana/dashboards:ro
    # Not on the platform's network: the gateway is the only container in front of it
    networks: [grafana-front, monitoring]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/grafana/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  node-exporter:
    image: prom/node-exporter:v1.9.1
    profiles: [monitoring]
    restart: unless-stopped
    mem_limit: 64m
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      # Without rslave, which Docker Desktop rejects (Ruling 18)
      - /:/host:ro
    networks: [monitoring]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9100/metrics"]
      interval: 10s
      timeout: 5s
      retries: 12

  cadvisor:
    # v0.54.1, not v0.52.1: v0.52.1 finds no container under Docker's containerd image store (Docker
    # Desktop's default; "failed to identify the read-write layer ID")
    image: gcr.io/cadvisor/cadvisor:v0.54.1
    profiles: [monitoring]
    restart: unless-stopped
    mem_limit: 128m
    command:
      - --housekeeping_interval=30s
      - --docker_only=true
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service
      # Only CPU, memory and start times are used; the rest would cost memory and series
      - --disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,percpu,process,referenced_memory,resctrl,sched,tcp,udp,disk,diskIO,network
    # No /:/rootfs and no whole /var/run. Both sockets are needed: with the Docker socket alone the Docker
    # factory fails to register (it talks to containerd too) and no container is found. create_host_path:
    # false makes a missing socket a start-up error, instead of an empty directory and no containers.
    # read_only does not limit what a socket's API allows
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /var/run/containerd/containerd.sock
        target: /run/containerd/containerd.sock
        read_only: true
        bind: {create_host_path: false}
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [monitoring]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    profiles: [monitoring]
    restart: unless-stopped
    mem_limit: 64m
    # Refuses to start without its password (Ruling 17). v0.17.1 has no --collector.stat_statements.include_query
    # (it came in v0.18): the statement series carry queryid, not the query text
    entrypoint: ["/bin/sh", "-c", "if [ -z \"$$DATA_SOURCE_PASS\" ]; then echo 'postgres-exporter: set MONITORING_DB_PASSWORD in .env' >&2; exit 1; fi; exec /bin/postgres_exporter --collector.stat_statements"]
    environment:
      # Over the network as qeos_monitor (pg_monitor only; db-init creates it)
      DATA_SOURCE_URI: postgres:5432/postgres?sslmode=disable
      DATA_SOURCE_USER: qeos_monitor
      DATA_SOURCE_PASS: ${MONITORING_DB_PASSWORD:-}
    networks: [default, monitoring]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9187/metrics"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      db-init:
        condition: service_completed_successfully

networks:
  # The gateway and Grafana only: Grafana's auth proxy trusts a user header, so no other container joins
  # it. A fixed subnet gives the gateway the fixed address Grafana trusts (GF_AUTH_PROXY_WHITELIST);
  # dynamic addresses come from the upper half, so Grafana can never take .10. If the host already uses
  # 172.30.1.0/24, set GRAFANA_FRONT_SUBNET, GRAFANA_FRONT_IP_RANGE (upper half) and GATEWAY_GRAFANA_FRONT_IP
  # (inside the subnet, outside the range) in .env; the whitelist follows the last one.
  grafana-front:
    ipam:
      config:
        - subnet: ${GRAFANA_FRONT_SUBNET:-172.30.1.0/24}
          ip_range: ${GRAFANA_FRONT_IP_RANGE:-172.30.1.128/25}
  # Prometheus, Alertmanager, Grafana and the exporters
  monitoring:

volumes:
  # Explicit names: the physical volumes keep the names they had under the old compose project
  # "qa-vision" (keys "qav_*" before the QEOS rename), so renaming the project to "qeos" moves no data.
  qeos_postgres_data:
    name: qa-vision_qav_postgres_data
  qeos_gateway_certs:
    name: qa-vision_qav_gateway_certs
  # Screenshots (ADR-036): back it up with the databases (deploy/README.md section 7)
  qeos_minio_data:
    name: qa-vision_qeos_minio_data
  # Monitoring profile (Ruling 16). Grafana needs no backup: everything in it is provisioned from the repo
  qeos_prometheus_data:
    name: qa-vision_qeos_prometheus_data
  qeos_grafana_data:
    name: qa-vision_qeos_grafana_data
